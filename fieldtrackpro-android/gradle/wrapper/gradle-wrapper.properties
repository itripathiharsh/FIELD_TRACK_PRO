########################################################################
# Gradle wrapper configuration.
#
# The project shipped without any wrapper configuration at all, so
# `./gradlew` could not exist and the build was unreproducible: whoever
# built it used whatever Gradle happened to be on their PATH.
#
# Gradle 8.9 is the version required by Android Gradle Plugin 8.7.2
# (declared in gradle/libs.versions.toml).
#
# NOTE: this file alone does not make the project buildable. The wrapper
# JAR and the `gradlew` / `gradlew.bat` scripts are binaries that must be
# generated by an existing Gradle installation:
#
#     gradle wrapper --gradle-version 8.9
#
# See docs/REPAIR_VERIFICATION.md for the exact environment blocker.
########################################################################
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
