# Non-secret production configuration for release builds (read by app/build.gradle.kts).
# Secrets (keystore + passwords) are NOT here: set FIELDTRACK_SIGNING_PROPERTIES to the external signing file.

# Production backend (also the build-script default). The release guard refuses non-https, local-network and legacy hosts.
RELEASE_BASE_URL=https://51-79-158-138.sslip.io/

# Map style for the outlet map: OpenFreeMap (free, no API key, commercial use allowed).
MAPLIBRE_TILE_URL=https://tiles.openfreemap.org/styles/liberty

# Public pages on the existing Vercel site (static files shipped in the release publish bundle).
PRIVACY_POLICY_URL=https://fieldtrack-pro-rosy.vercel.app/privacy.html
DELETION_URL=https://fieldtrack-pro-rosy.vercel.app/account-deletion.html

# No google-services.json exists for this project: push (FCM) stays disabled, exactly like the current field app.
# In-app notifications still arrive through the periodic notification sync.
ALLOW_NO_FCM=true

# In-app updates
UPDATE_MANIFEST_URL=https://fieldtrack-pro-rosy.vercel.app/downloads/app-update.json
UPDATE_ALLOWED_HOSTS=fieldtrack-pro-rosy.vercel.app
