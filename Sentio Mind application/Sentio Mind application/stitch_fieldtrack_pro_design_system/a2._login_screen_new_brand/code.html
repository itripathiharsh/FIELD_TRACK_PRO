<body class="min-h-screen flex items-center justify-center p-4">
<!-- Main Canvas Content -->
<main class="w-full max-w-[1000px] bg-surface-container-lowest rounded-xl border border-surface-container-highest shadow-sm overflow-hidden flex flex-col md:flex-row">
<!-- Left Side: Image / Branding -->
<div class="hidden md:block w-1/2 bg-primary-container relative">
<div class="absolute inset-0 bg-cover bg-center opacity-40" data-alt="A sophisticated industrial warehouse setting with soft overhead lighting, showcasing a clean, modern logistics environment. A prominent focus on structured shelving and high-tech inventory management systems. Deep navy blue hues dominate the shadows, contrasted sharply by vibrant gold accents on safety equipment and signage, reflecting a highly secure and professional atmosphere." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCSix1Yi4vV9gaiz671FpOSb_hXj2mKc4qGuosgqf1hLPyUsG-LshuLtDf7V2EEyidJt9lepj1SuQzXYvLI70zG9Ht2RWSgle7Gn2lggqPtsXkfql6cIDnkYzH_9__VBH2gl6NUZLP5VCheTNc97LiUoftuyH9C6fK1LCTzfkJpuW7h0o_9JpobvExaq5g6x8z2pB3hs0Ysm043UTEsXWhV_xLRHroU3XXS2RIu-4oJ9Uf7huMhatG-')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-primary to-transparent opacity-80"></div>
<div class="relative h-full flex flex-col justify-end p-margin z-10 text-on-primary">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1; font-size: 32px;">dashboard</span>
<h2 class="font-headline-lg text-headline-lg">FieldTrack Pro</h2>
</div>
<p class="font-body-md text-body-md text-inverse-on-surface opacity-90 max-w-sm">Secure, efficient, and reliable field management. Access your centralized dashboard to manage logistics and operations seamlessly.</p>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full md:w-1/2 p-margin md:p-12 flex flex-col justify-center">
<div class="mb-8">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your credentials to access the system.</p>
</div>
<form class="space-y-6">
<div>
<label class="block font-label-md text-label-md text-primary uppercase mb-2" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md text-on-surface" id="email" placeholder="admin@fieldtrack.com" type="email"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-primary uppercase mb-2" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md text-on-surface" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<div class="flex justify-end mt-2">
<a class="font-nav-link text-nav-link text-primary hover:text-secondary-container transition-colors" href="#">Forgot password?</a>
</div>
</div>
<div class="pt-4">
<button class="w-full bg-secondary-container hover:bg-secondary-fixed-dim text-tertiary font-button text-button uppercase py-4 rounded-DEFAULT transition-colors flex items-center justify-center gap-2" type="button">
<span>Sign In Securely</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-8 text-center border-t border-surface-container-highest pt-6">
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Need access? <a class="font-nav-link text-nav-link text-primary font-bold hover:underline" href="#">Contact Administrator</a></p>
</div>
</div>
</main>
</body></html>
