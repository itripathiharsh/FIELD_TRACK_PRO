<body class="bg-background min-h-screen text-on-background antialiased flex flex-col md:flex-row relative">
<!-- Modal Overlay Backdrop (Full Screen) -->
<div class="fixed inset-0 bg-primary/40 z-50 flex items-center justify-center p-4 md:p-8 backdrop-blur-sm">
<!-- Export Modal Container -->
<div class="bg-surface w-full max-w-2xl rounded-xl border border-outline-variant shadow-[0px_4px_12px_rgba(0,0,0,0.08)] flex flex-col overflow-hidden animate-[fade-in-up_0.3s_ease-out]">
<!-- Modal Header -->
<div class="flex items-center justify-between px-6 md:px-8 py-5 border-b border-surface-variant bg-surface-container-lowest">
<div>
<h2 class="font-headline-md text-headline-md text-primary">Export Options</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1 text-sm">Configure your data export settings</p>
</div>
<button class="text-on-surface-variant hover:text-primary transition-colors p-2 rounded-full hover:bg-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-secondary">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-6 md:p-8 flex flex-col gap-8 bg-surface-container-lowest">
<!-- Format Selection (Bento Style) -->
<div class="flex flex-col gap-4">
<h3 class="font-label-md text-label-md text-primary uppercase">File Format</h3>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
<!-- PDF Option -->
<label class="cursor-pointer group relative">
<input checked="" class="peer sr-only" name="format" type="checkbox" value="pdf"/>
<div class="h-full border border-outline-variant bg-surface rounded-lg p-5 flex flex-col items-center justify-center gap-3 transition-all duration-200 peer-checked:border-secondary peer-checked:bg-secondary-container/10 peer-checked:ring-1 peer-checked:ring-secondary hover:shadow-[0px_4px_12px_rgba(0,0,0,0.08)]">
<span class="material-symbols-outlined text-4xl text-on-surface-variant peer-checked:text-secondary group-hover:text-primary transition-colors" data-icon="picture_as_pdf">picture_as_pdf</span>
<span class="font-headline-sm text-headline-sm text-primary peer-checked:text-secondary">PDF</span>
</div>
<div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-secondary" data-icon="check_circle" data-weight="fill">check_circle</span>
</div>
</label>
<!-- Excel Option -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="format" type="checkbox" value="excel"/>
<div class="h-full border border-outline-variant bg-surface rounded-lg p-5 flex flex-col items-center justify-center gap-3 transition-all duration-200 peer-checked:border-secondary peer-checked:bg-secondary-container/10 peer-checked:ring-1 peer-checked:ring-secondary hover:shadow-[0px_4px_12px_rgba(0,0,0,0.08)]">
<span class="material-symbols-outlined text-4xl text-on-surface-variant peer-checked:text-secondary group-hover:text-primary transition-colors" data-icon="table_view">table_view</span>
<span class="font-headline-sm text-headline-sm text-primary peer-checked:text-secondary">Excel</span>
</div>
<div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-secondary" data-icon="check_circle" data-weight="fill">check_circle</span>
</div>
</label>
<!-- CSV Option -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="format" type="checkbox" value="csv"/>
<div class="h-full border border-outline-variant bg-surface rounded-lg p-5 flex flex-col items-center justify-center gap-3 transition-all duration-200 peer-checked:border-secondary peer-checked:bg-secondary-container/10 peer-checked:ring-1 peer-checked:ring-secondary hover:shadow-[0px_4px_12px_rgba(0,0,0,0.08)]">
<span class="material-symbols-outlined text-4xl text-on-surface-variant peer-checked:text-secondary group-hover:text-primary transition-colors" data-icon="csv">description</span>
<span class="font-headline-sm text-headline-sm text-primary peer-checked:text-secondary">CSV</span>
</div>
<div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-secondary" data-icon="check_circle" data-weight="fill">check_circle</span>
</div>
</label>
</div>
</div>
<!-- Date Range Selector -->
<div class="flex flex-col gap-4">
<h3 class="font-label-md text-label-md text-primary uppercase">Date Range</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-surface-container-low p-5 rounded-lg border border-surface-variant">
<!-- Start Date -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase text-xs" for="start-date">Start Date</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="calendar_today">calendar_today</span>
</div>
<input class="w-full pl-10 pr-3 py-2 bg-surface border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-primary outline-none transition-all" id="start-date" type="date"/>
</div>
</div>
<!-- End Date -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase text-xs" for="end-date">End Date</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="calendar_today">calendar_today</span>
</div>
<input class="w-full pl-10 pr-3 py-2 bg-surface border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-primary outline-none transition-all" id="end-date" type="date"/>
</div>
</div>
</div>
</div>
<!-- Additional Settings (Optional details) -->
<div class="flex flex-col gap-3">
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded border border-outline-variant checked:border-secondary checked:bg-secondary transition-all" type="checkbox"/>
<span class="absolute text-white opacity-0 peer-checked:opacity-100 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none material-symbols-outlined text-[16px]" data-icon="check">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-primary transition-colors">Include archived records</span>
</label>
</div>
</div>
<!-- Modal Footer / Actions -->
<div class="px-6 md:px-8 py-5 border-t border-surface-variant bg-surface-container flex flex-col sm:flex-row justify-end items-center gap-4">
<button class="w-full sm:w-auto font-button text-button uppercase text-primary border border-primary bg-transparent px-6 py-3 rounded hover:bg-primary/5 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
                    Cancel
                </button>
<button class="w-full sm:w-auto font-button text-button uppercase text-on-primary bg-secondary px-8 py-3 rounded flex items-center justify-center gap-2 hover:bg-secondary-container hover:text-on-secondary-container transition-colors focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 focus:ring-offset-surface shadow-sm">
<span class="material-symbols-outlined text-sm" data-icon="download">download</span>
                    Export Report
                </button>
</div>
</div>
</div>
<!-- Background Content Mockup (to show overlay effect) -->
<div class="flex-1 flex flex-col opacity-50 pointer-events-none filter blur-sm">
<!-- Mock Top Bar -->
<header class="flex justify-between items-center h-16 w-full px-margin bg-surface border-b border-outline-variant">
<h1 class="font-headline-sm text-headline-sm font-bold text-primary">Overview</h1>
</header>
<!-- Mock Content -->
<main class="p-margin max-w-container-max mx-auto w-full grid grid-cols-1 md:grid-cols-3 gap-6">
<div class="bg-surface border border-outline-variant rounded-xl h-64 col-span-2"></div>
<div class="bg-surface border border-outline-variant rounded-xl h-64"></div>
<div class="bg-surface border border-outline-variant rounded-xl h-96 col-span-3"></div>
</main>
</div>
<style>
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</body></html>
