<script>
        // Simple OTP input progression
        const otpInputs = document.querySelectorAll('.otp-input');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });

        // Basic password strength visualizer (mock)
        const passwordInput = document.getElementById('new-password');
        const meterBars = document.querySelectorAll('.w-1\\/3');
        const strengthText = document.querySelector('.text-xs');

        passwordInput.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val.length === 0) {
                meterBars[0].className = 'h-full w-1/3 bg-error transition-all duration-300';
                meterBars[1].className = 'h-full w-1/3 bg-surface-variant transition-all duration-300';
                meterBars[2].className = 'h-full w-1/3 bg-surface-variant transition-all duration-300';
                strengthText.textContent = 'Weak Password';
                strengthText.className = 'text-xs font-label-md text-error mt-2 uppercase tracking-wide';
            } else if (val.length < 8) {
                meterBars[0].className = 'h-full w-1/3 bg-secondary-container transition-all duration-300';
                meterBars[1].className = 'h-full w-1/3 bg-secondary-container transition-all duration-300';
                meterBars[2].className = 'h-full w-1/3 bg-surface-variant transition-all duration-300';
                strengthText.textContent = 'Fair Password';
                strengthText.className = 'text-xs font-label-md text-secondary-container mt-2 uppercase tracking-wide';
            } else {
                meterBars[0].className = 'h-full w-1/3 bg-primary-container transition-all duration-300';
                meterBars[1].className = 'h-full w-1/3 bg-primary-container transition-all duration-300';
                meterBars[2].className = 'h-full w-1/3 bg-primary-container transition-all duration-300';
                strengthText.textContent = 'Strong Password';
                strengthText.className = 'text-xs font-label-md text-primary-container mt-2 uppercase tracking-wide';
            }
        });
    </script>
