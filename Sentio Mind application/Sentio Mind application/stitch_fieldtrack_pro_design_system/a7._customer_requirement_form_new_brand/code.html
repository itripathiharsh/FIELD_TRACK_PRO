<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FieldTrack Pro - Customer Requirement Form</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&amp;family=Libre+Baskerville:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e4e2e5",
                        "primary-container": "#14213d",
                        "surface": "#fbf8fb",
                        "on-secondary-fixed": "#2a1700",
                        "on-primary-fixed-variant": "#3a4664",
                        "surface-dim": "#dbd9dc",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#45464d",
                        "tertiary-fixed": "#ffddb6",
                        "surface-tint": "#525e7d",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-variant": "#e4e2e5",
                        "on-tertiary-container": "#a58359",
                        "secondary-fixed": "#ffddb8",
                        "inverse-on-surface": "#f2f0f3",
                        "primary-fixed-dim": "#b9c6ea",
                        "on-secondary-container": "#684000",
                        "inverse-primary": "#b9c6ea",
                        "tertiary-fixed-dim": "#e7c092",
                        "secondary-fixed-dim": "#ffb95f",
                        "outline": "#75777e",
                        "tertiary": "#130900",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-bright": "#fbf8fb",
                        "primary-fixed": "#d9e2ff",
                        "on-surface": "#1b1b1e",
                        "on-background": "#1b1b1e",
                        "secondary": "#855300",
                        "surface-container": "#f0edf0",
                        "surface-container-high": "#eae7ea",
                        "on-tertiary-fixed-variant": "#5c421e",
                        "on-primary-container": "#7c89aa",
                        "primary": "#000a24",
                        "inverse-surface": "#303033",
                        "on-secondary-fixed-variant": "#653e00",
                        "on-tertiary-fixed": "#2a1800",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#321d00",
                        "secondary-container": "#ffa515",
                        "on-tertiary": "#ffffff",
                        "outline-variant": "#c5c6ce",
                        "on-primary-fixed": "#0d1b36",
                        "surface-container-low": "#f5f3f6",
                        "on-secondary": "#ffffff",
                        "background": "#fbf8fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "container-max": "1440px",
                        "margin": "32px",
                        "base": "8px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "headline-sm": ["League Spartan"],
                        "label-md": ["League Spartan"],
                        "button": ["League Spartan"],
                        "nav-link": ["League Spartan"],
                        "headline-lg": ["League Spartan"],
                        "body-md": ["Libre Baskerville"],
                        "headline-md": ["League Spartan"],
                        "body-lg": ["Libre Baskerville"],
                        "headline-lg-mobile": ["League Spartan"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "button": ["16px", { "lineHeight": "1", "fontWeight": "700" }],
                        "nav-link": ["15px", { "lineHeight": "1", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Form specific custom styles following Design System */
        input[type="text"], input[type="email"], input[type="tel"], textarea, select {
            border: 1px solid #D1D1D1;
            border-radius: 8px;
            padding: 12px 16px;
            font-family: 'Libre Baskerville', serif;
            font-size: 16px;
            background-color: #ffffff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #000a24; /* Primary Navy on focus */
            box-shadow: 0 0 0 1px #000a24; /* Subtle ring */
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #000a24; /* Navy labels */
            text-transform: uppercase;
        }

        .btn-primary {
            background-color: #FCA311;
            color: #000000;
            text-transform: uppercase;
            padding: 12px 24px;
            border-radius: 4px;
            transition: opacity 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-secondary {
            background-color: transparent;
            color: #14213d;
            border: 1px solid #14213d;
            text-transform: uppercase;
            padding: 12px 24px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .btn-secondary:hover {
            background-color: rgba(20, 33, 61, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="bg-surface border-b border-surface-container-highest docked full-width top-0 z-40">
<div class="flex justify-between items-center w-full px-4 md:px-6 h-[64px]">
<div class="flex items-center gap-4">
<button aria-label="Back" class="md:hidden text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg font-bold text-primary">FieldTrack Pro</div>
</div>
<div class="flex items-center gap-4">
<button aria-label="Notifications" class="text-on-surface-variant hover:bg-secondary-tint rounded-full p-2">
<span class="material-symbols-outlined">notifications</span>
</button>
<button aria-label="User Profile" class="text-on-surface-variant hover:bg-secondary-tint rounded-full p-2">
<span class="material-symbols-outlined">account_circle</span>
</button>
</div>
</div>
</header>
<div class="flex flex-1 pt-[64px] pb-[80px] md:pb-0 overflow-hidden">
<!-- SideNavBar (Hidden on Mobile, Visible on Desktop) -->
<!-- Suppressing sidebar for this focused form view based on UX guidelines -->
<aside class="hidden md:flex w-[240px] h-screen fixed left-0 top-0 bg-surface flex-col py-6 px-4 shadow-sm z-30 pt-[88px] border-r border-surface-container-highest">
<nav class="flex flex-col gap-2 w-full">
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container transition-colors" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-nav-link text-nav-link">Dashboard</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container transition-colors" href="#">
<span class="material-symbols-outlined">badge</span>
<span class="font-nav-link text-nav-link">Employees</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-primary font-bold border-l-4 border-[#FCA311] bg-surface-container-low transition-colors" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-nav-link text-nav-link">Customers</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container transition-colors" href="#">
<span class="material-symbols-outlined">location_on</span>
<span class="font-nav-link text-nav-link">Visits</span>
</a>
</nav>
</aside>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto bg-[#E5E5E5] w-full md:pl-[240px]">
<div class="max-w-3xl mx-auto p-4 md:p-8">
<!-- Page Header -->
<div class="mb-6 md:mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
<div>
<h1 class="font-headline-md text-headline-md text-primary mb-1">Customer Requirement Form</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Log new requirements for field evaluation.</p>
</div>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-[8px] border border-[#D1D1D1] shadow-sm p-6 md:p-8">
<form class="space-y-6" id="requirementForm">
<!-- Client Info Section -->
<div>
<h2 class="font-headline-sm text-headline-sm text-primary mb-4 border-b border-[#D1D1D1] pb-2">Client Details</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div>
<label class="font-label-md text-label-md" for="clientName">Company Name</label>
<input class="w-full" id="clientName" name="clientName" placeholder="e.g. Apex Industrial" required="" type="text"/>
</div>
<div>
<label class="font-label-md text-label-md" for="contactPerson">Primary Contact</label>
<input class="w-full" id="contactPerson" name="contactPerson" placeholder="Full Name" required="" type="text"/>
</div>
<div>
<label class="font-label-md text-label-md" for="contactEmail">Email Address</label>
<input class="w-full" id="contactEmail" name="contactEmail" placeholder="contact@company.com" required="" type="email"/>
</div>
<div>
<label class="font-label-md text-label-md" for="contactPhone">Phone Number</label>
<input class="w-full" id="contactPhone" name="contactPhone" placeholder="(555) 123-4567" type="tel"/>
</div>
</div>
</div>
<!-- Requirement Details Section -->
<div class="pt-4">
<h2 class="font-headline-sm text-headline-sm text-primary mb-4 border-b border-[#D1D1D1] pb-2">Requirement Specifications</h2>
<div class="space-y-6">
<div>
<label class="font-label-md text-label-md" for="reqType">Request Category</label>
<select class="w-full md:w-1/2" id="reqType" name="reqType">
<option value="">Select Category...</option>
<option value="maintenance">Routine Maintenance</option>
<option value="installation">New Installation</option>
<option value="inspection">Safety Inspection</option>
<option value="repair">Emergency Repair</option>
</select>
</div>
<div>
<label class="font-label-md text-label-md" for="priorityLevel">Priority Level</label>
<div class="flex gap-4 mt-2">
<label class="flex items-center gap-2 cursor-pointer normal-case font-body-md text-body-md">
<input class="text-primary focus:ring-primary h-4 w-4 border-[#D1D1D1]" name="priority" type="radio" value="low"/>
                                            Low
                                        </label>
<label class="flex items-center gap-2 cursor-pointer normal-case font-body-md text-body-md">
<input checked="" class="text-primary focus:ring-primary h-4 w-4 border-[#D1D1D1]" name="priority" type="radio" value="medium"/>
                                            Medium
                                        </label>
<label class="flex items-center gap-2 cursor-pointer normal-case font-body-md text-body-md">
<input class="text-[#ba1a1a] focus:ring-[#ba1a1a] h-4 w-4 border-[#D1D1D1]" name="priority" type="radio" value="high"/>
<span class="text-[#ba1a1a] font-medium">High</span>
</label>
</div>
</div>
<div>
<label class="font-label-md text-label-md" for="description">Detailed Description</label>
<textarea class="w-full" id="description" name="description" placeholder="Describe the specific requirements, location details, and any hazards..." rows="4"></textarea>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-6 flex flex-col-reverse md:flex-row justify-end gap-4 border-t border-[#D1D1D1]">
<button class="btn-secondary font-button text-button w-full md:w-auto" type="button">Cancel</button>
<button class="btn-primary font-button text-button w-full md:w-auto" type="submit">Submit Requirement</button>
</div>
</form>
</div>
</div>
<!-- Auto-save Footer -->
<div class="fixed bottom-0 md:bottom-0 md:left-[240px] right-0 bg-surface border-t border-[#D1D1D1] p-3 flex items-center justify-between z-20 pb-safe md:pb-3 h-auto md:h-12 text-sm">
<div class="flex items-center gap-2 text-on-surface-variant ml-4 md:ml-8">
<span class="material-symbols-outlined text-[18px]">cloud_done</span>
<span class="font-body-md text-[14px]" id="saveStatus">Draft auto-saved at 10:42 AM</span>
</div>
</div>
</main>
</div>
<script>
        // Simple auto-save simulation
        const form = document.getElementById('requirementForm');
        const status = document.getElementById('saveStatus');
        
        form.addEventListener('input', () => {
            status.textContent = 'Saving...';
            status.previousElementSibling.textContent = 'cloud_sync';
            status.previousElementSibling.classList.add('animate-spin');
            
            clearTimeout(window.saveTimeout);
            window.saveTimeout = setTimeout(() => {
                const now = new Date();
                status.textContent = `Draft auto-saved at ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                status.previousElementSibling.textContent = 'cloud_done';
                status.previousElementSibling.classList.remove('animate-spin');
            }, 1000);
        });
    </script>
</body></html>
