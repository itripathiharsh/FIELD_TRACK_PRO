<body class="font-body-md text-on-background min-h-screen flex flex-col pt-16 pb-16 md:pb-0">
<!-- TopAppBar -->
<header class="bg-primary text-on-primary fixed top-0 w-full z-50 border-b border-outline-variant flex items-center justify-between px-margin h-16 shadow-none">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-primary-fixed-dim/10 transition-colors scale-95 active:opacity-80 transition-all text-on-primary">

<h1 class="font-headline-sm text-headline-sm text-on-primary tracking-widest uppercase">FIELD OPS</h1>
<button class="flex items-center justify-center p-2 rounded-full hover:bg-primary-fixed-dim/10 transition-colors scale-95 active:opacity-80 transition-all text-on-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">sync</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-container-max mx-auto px-4 md:px-margin py-8 flex items-start justify-center">
<div class="bg-surface-container-lowest border border-brand-border rounded-xl w-full max-w-2xl p-6 shadow-sm md:mt-8">
<div class="border-b border-brand-border pb-4 mb-6">
<h2 class="font-headline-md text-headline-md text-primary">Customer Authorization</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Please review and sign to complete the visit.</p>
</div>
<!-- Customer Name Input -->
<div class="mb-6">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase mb-2" for="customerName">Customer Name</label>
<input class="w-full px-4 py-3 border border-brand-border rounded-DEFAULT focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md text-on-surface bg-surface-container-lowest placeholder:text-outline" id="customerName" placeholder="Enter full name" type="text"/>
</div>
<!-- Signature Canvas Area -->
<div class="mb-8">
<div class="flex justify-between items-end mb-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase">Signature</label>
<button class="font-label-md text-label-md text-brand-accent hover:underline uppercase tracking-wide">Clear</button>
</div>
<div class="border border-brand-border rounded-lg bg-surface-container-low h-64 w-full relative cursor-crosshair">
<!-- Placeholder for canvas -->
<div class="absolute inset-0 flex items-center justify-center opacity-20 pointer-events-none">
<span class="material-symbols-outlined text-6xl text-on-surface-variant">draw</span>
</div>
</div>
</div>

<div class="mt-8 pt-4 border-t border-brand-border flex justify-end">
<button class="bg-[#FCA311] text-[#000000] font-button text-button uppercase px-8 py-4 rounded-DEFAULT shadow-sm hover:shadow-md transition-all active:scale-95 flex items-center gap-2">
