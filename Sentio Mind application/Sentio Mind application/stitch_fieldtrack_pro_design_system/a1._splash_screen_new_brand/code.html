<!-- Splash Screen Container -->
<div class="flex flex-col items-center justify-center w-full h-full max-w-container-max mx-auto px-margin md:px-margin opacity-0 animate-fade-in">
<!-- Logo Wrapper -->
<div class="w-64 md:w-96 aspect-square rounded-2xl overflow-hidden shadow-2xl mb-12 transform hover:scale-105 transition-transform duration-500 ease-out">
<img alt="FieldTrack Pro Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLs_6ncBDy-it0treShdcPchGlmXcIC-BYHxDWoTRAwKBlTDhuwH2aqsiYrEMlNMAhU4zmcPMcH_8q2RZnJtITGbVGbXBmRjQy_idbIXSkJKYsAlkmjM2cnfrqg9vwU9IdIe0vKvK78k1qK8yIkjrBquN-uPeiZxyzrFQrCJQfGNZYtT2zJWdPV7GjnQlkl3W9f3YqvJ1_17tB0If8txH6lPWfIS_7_-Sqehk6T4R1i_KuC7RiieuNIxBQ"/>
</div>
<!-- Typography / Brand Name (Fallback if logo image doesn't load immediately or for accessibility, though image is primary here) -->
<!-- Hidden visually but kept for screen readers, or we can display it below if desired by the prompt's focus on League Spartan typography -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-primary text-center tracking-tight mb-4">
            FieldTrack <span class="text-secondary-container">Pro</span>
</h1>
<!-- Loading Indicator / Subtext -->
<p class="font-label-md text-label-md text-on-primary-container uppercase tracking-widest flex items-center gap-2">
<span class="material-symbols-outlined text-secondary-container animate-spin" style="font-variation-settings: 'FILL' 1;">
                settings
            </span>
            Initializing System...
        </p>
<!-- Progress Bar (Decorative) -->
<div class="w-48 h-1 bg-surface-tint rounded-full mt-8 overflow-hidden">
<div class="h-full bg-secondary-container rounded-full w-1/3 animate-progress"></div>
</div>
</div>
<!-- Inline Styles for specific animations -->
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes progress {
            0% { width: 0%; transform: translateX(-100%); }
            50% { width: 50%; transform: translateX(0); }
            100% { width: 100%; transform: translateX(100%); }
        }
        .animate-progress {
            animation: progress 2s infinite ease-in-out;
        }
    </style>
<!-- Simple JS to simulate splash screen loading complete (redirect or transition out) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simulate a loading delay then transition out
            setTimeout(() => {
                const splashContainer = document.querySelector('.animate-fade-in');
                if(splashContainer) {
                    splashContainer.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
                    splashContainer.style.opacity = '0';
                    splashContainer.style.transform = 'translateY(-20px)';
                    
                    // In a real app, this would route to the next page
                    // console.log("Transitioning to dashboard...");
                }
            }, 3000); // 3 seconds splash
        });
    </script>
