<style>
        .map-gradient-overlay {
            background: linear-gradient(180deg, rgba(251, 248, 251, 0) 0%, rgba(251, 248, 251, 1) 100%);
        }

<body class="bg-background text-on-background h-full font-body-md text-body-md overflow-hidden flex flex-col">
<!-- Intent: Task-Focused / Sub-page (Pre-navigation view) -> Suppressing BottomNavBar and TopAppBar (using custom back header) -->
<!-- Header (Task Context) -->
<header class="bg-surface border-b border-surface-container-highest z-40 px-space-4 py-space-4 flex items-center justify-between shadow-sm flex-shrink-0">
<button class="flex items-center text-primary p-2 hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="text-center">
<h1 class="font-headline-sm text-headline-sm text-primary">Route Summary</h1>
<p class="font-label-md text-label-md text-on-surface-variant uppercase mt-1">Visit #8492</p>
</div>
<button class="flex items-center text-primary p-2 hover:bg-surface-container rounded-full transition-colors opacity-0 pointer-events-none">
<span class="material-symbols-outlined text-[24px]">more_vert</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 relative flex flex-col md:flex-row w-full max-w-container-max mx-auto overflow-hidden">
<!-- Map Canvas (Background on mobile, left pane on desktop) -->
<div class="absolute inset-0 md:relative md:w-2/3 h-full z-0 flex flex-col">
<!-- Simulated Map Background -->
<div class="flex-1 bg-cover bg-center w-full relative" data-alt="A detailed overhead satellite view of a modern industrial park or commercial district. The map style is clean, high-contrast, and tailored for a professional logistics application, featuring distinct roads, stark white building footprints, and subtle topographical details. The overall color palette uses muted grays, soft whites, and faint hints of deep navy, lit evenly to ensure absolute clarity for navigation purposes." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDvuchFt2z9w9t020pIutzmZf2mPygbAb7NCZEG7isyUI4G2pI95r6TUSYtd1FQ_EKbg9K7M_aU38mzE1q2q83eGlDt2mzSe35bOoq1VTD5aMKXqs6lXL2fqnkwp-YcRldDLt_FAK8wPuyVIrPIUXHKla4z8m4EJc6yQw7GUo6u-5R8qFApaHVTZGFi4QeBXSN5CSEgL3MabMyOh6fjJ21ItqkQNFn8aTvVpURS2cGK_XbT5_ssBMOK')">
<!-- Destination Pin -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center animate-bounce z-20">
<div class="bg-secondary-container text-on-secondary-container rounded-full p-2 shadow-lg border-2 border-surface-container-lowest">
<span class="material-symbols-outlined text-[32px] font-bold" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="w-4 h-1 bg-primary/20 rounded-full mt-1 blur-[2px]"></div>
</div>
<!-- Origin Pin -->
<div class="absolute top-[80%] left-[30%] transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center z-10">
<div class="bg-primary text-on-primary rounded-full p-2 shadow-md border-2 border-surface-container-lowest">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">my_location</span>
</div>
</div>
<!-- Simulated Route Line (SVG) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none z-10" preserveaspectratio="none">
<path class="opacity-80" d="M 30% 80% Q 50% 60% 50% 50%" fill="none" stroke="#14213d" stroke-dasharray="10 10" stroke-width="6"></path>
</svg>
</div>
<!-- Bottom fade for mobile to blend into the card -->
<div class="md:hidden h-32 map-gradient-overlay absolute bottom-0 w-full z-10 pointer-events-none"></div>
</div>
<!-- Details Panel (Bottom sheet on mobile, right sidebar on desktop) -->
<div class="z-20 md:w-1/3 bg-surface md:border-l border-surface-container-highest shadow-[0_-8px_24px_rgba(0,0,0,0.08)] md:shadow-none mt-auto md:mt-0 flex flex-col max-h-[530px] md:max-h-full rounded-t-xl md:rounded-none">
<!-- Mobile Drag Handle -->
<div class="w-full flex justify-center py-4 md:hidden flex-shrink-0">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<!-- Content Container -->
<div class="px-space-4 pb-space-6 md:py-space-6 flex-1 overflow-y-auto flex flex-col gap-6">
<!-- Destination Info -->
<div class="flex flex-col gap-2">
<div class="flex items-start justify-between">
<h2 class="font-headline-md text-headline-md text-primary">Apex Industrial Corp</h2>
<span class="bg-secondary-container/20 text-secondary-container font-label-md text-label-md uppercase px-3 py-1 rounded border border-secondary-container/30">Priority</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">business</span>
                        1420 Enterprise Way, Suite 100
                    </p>
</div>
<div class="h-px bg-surface-container-highest w-full"></div>
<!-- Logistics Metrics (Bento Grid Style) -->
<div class="grid grid-cols-2 gap-4">
<!-- ETA Card -->
<div class="bg-surface-container-low border border-surface-container-highest rounded-xl p-4 flex flex-col justify-between">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary text-[20px]">schedule</span>
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Est. Arrival</span>
</div>
<div class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary">
                            14 mins
                        </div>
<div class="font-body-md text-body-md text-on-surface-variant mt-1">
                            Arrive by 10:45 AM
                        </div>
</div>
<!-- Distance Card -->
<div class="bg-surface-container-low border border-surface-container-highest rounded-xl p-4 flex flex-col justify-between">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary text-[20px]">route</span>
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Distance</span>
</div>
<div class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary">
                            4.2 mi
                        </div>
<div class="font-body-md text-body-md text-on-surface-variant mt-1">
                            Via I-95 North
                        </div>
</div>
</div>
<!-- Route Options -->
<div class="flex flex-col gap-3">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-1">Route Preferences</h3>
<label class="flex items-center p-3 border border-surface-container-highest rounded-lg bg-surface hover:bg-surface-container transition-colors cursor-pointer group">
<div class="flex-1">
<span class="block font-headline-sm text-headline-sm text-primary group-hover:text-primary-container">Fastest Route</span>
<span class="block font-body-md text-body-md text-on-surface-variant mt-1">Current selection based on live traffic</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-primary"></div>
</div>
</label>
<label class="flex items-center p-3 border border-surface-container-highest rounded-lg bg-surface hover:bg-surface-container transition-colors cursor-pointer group opacity-60">
<div class="flex-1">
<span class="block font-headline-sm text-headline-sm text-primary group-hover:text-primary-container">Avoid Tolls</span>
<span class="block font-body-md text-body-md text-on-surface-variant mt-1">+8 mins • 5.1 mi</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center">
<!-- Unselected -->
</div>
</label>
</div>
</div>
<!-- Action Area (Sticky Bottom) -->
<div class="px-space-4 py-space-4 border-t border-surface-container-highest bg-surface flex flex-col gap-3 flex-shrink-0 mb-safe">
<button class="w-full bg-primary text-on-primary font-button text-button uppercase py-4 px-6 rounded-xl shadow-md hover:bg-primary-container transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[24px]">navigation</span>
                    Open Navigation
                </button>
<button class="w-full bg-transparent border border-primary-container text-primary-container font-button text-button uppercase py-3 px-6 rounded-xl hover:bg-surface-container transition-colors">
                    Cancel Visit
                </button>
</div>
</div>
</main>
</body></html>
