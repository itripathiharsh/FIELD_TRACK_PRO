<style>
        .animate-slide-up {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        .animate-scale-in {
            animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: scale(0.9);
        }

        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Ambient glow effect */
        .ambient-glow {
            background: radial-gradient(circle at 50% 0%, rgba(255, 165, 21, 0.15) 0%, transparent 60%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-primary min-h-screen flex flex-col text-on-primary font-body-md antialiased overflow-x-hidden selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Navigation Shell Suppressed as per instructions for Transactional/Success Screens -->
<!-- Background Ambient Glow -->
<div class="fixed inset-0 ambient-glow pointer-events-none z-0"></div>
<!-- Main Content Container -->
<main class="flex-1 flex flex-col items-center justify-center p-6 md:p-margin w-full max-w-container-max mx-auto relative z-10 min-h-screen">
<!-- Brand Header (Minimal) -->
<header class="absolute top-6 left-0 right-0 flex justify-center w-full animate-fade-in">
<h1 class="font-headline-sm text-headline-sm text-on-primary tracking-widest uppercase opacity-70">
                Field Ops
            </h1>
</header>
<!-- Success Core -->
<div class="flex flex-col items-center text-center w-full max-w-lg mt-12">
<!-- Icon -->
<div class="relative flex items-center justify-center w-24 h-24 md:w-32 md:h-32 rounded-full bg-secondary-container/10 mb-8 animate-scale-in">
<!-- Inner pulse ring -->
<div class="absolute inset-0 rounded-full border-2 border-secondary-container/30 animate-[ping_2s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
<!-- Core icon -->
<span class="material-symbols-outlined text-[64px] md:text-[80px] text-secondary-container" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
</div>
<!-- Headline -->
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-primary mb-3 animate-slide-up delay-100">
                Visit Summary Submitted Successfully
            </h2>
<p class="font-body-md text-body-md text-on-primary-container mb-10 animate-slide-up delay-200 max-w-sm">
                Your report has been logged and synced with central dispatch.
            </p>
<!-- Visit Details Bento Grid -->
<div class="w-full bg-primary-container/80 backdrop-blur-md rounded-xl border border-outline-variant/30 overflow-hidden mb-10 animate-slide-up delay-300 shadow-lg text-left">
<!-- Card Header -->
<div class="bg-surface-tint/10 px-6 py-4 border-b border-outline-variant/20 flex items-center gap-3">
<span class="material-symbols-outlined text-secondary-container text-xl" style="font-variation-settings: 'FILL' 1;">
                        domain
                    </span>
<h3 class="font-headline-sm text-headline-sm text-on-primary">
                        Apex Industrial Facility
                    </h3>
</div>
<!-- Grid Data -->
<div class="grid grid-cols-2 gap-4 p-6">
<div class="flex flex-col gap-1">
<span class="font-label-md text-label-md text-on-primary-container uppercase">Date</span>
<div class="flex items-center gap-2 text-on-primary font-body-md text-body-md">
<span class="material-symbols-outlined text-[18px] opacity-70">calendar_today</span>
                            Oct 24, 2023
                        </div>
</div>
<div class="flex flex-col gap-1">
<span class="font-label-md text-label-md text-on-primary-container uppercase">Duration</span>
<div class="flex items-center gap-2 text-on-primary font-body-md text-body-md">
<span class="material-symbols-outlined text-[18px] opacity-70">schedule</span>
                            1h 45m
                        </div>
</div>
<div class="flex flex-col gap-1 col-span-2 mt-2 pt-4 border-t border-outline-variant/20">
<span class="font-label-md text-label-md text-on-primary-container uppercase">Key Actions</span>
<div class="flex flex-wrap gap-2 mt-2">
<span class="px-3 py-1 bg-surface-tint/20 rounded-full font-label-md text-label-md text-primary-fixed border border-outline-variant/20">
                                Safety Inspection
                            </span>
<span class="px-3 py-1 bg-surface-tint/20 rounded-full font-label-md text-label-md text-primary-fixed border border-outline-variant/20">
                                Meter Read
                            </span>
<span class="px-3 py-1 bg-surface-tint/20 rounded-full font-label-md text-label-md text-primary-fixed border border-outline-variant/20">
                                Client Sign-off
                            </span>
</div>
</div>
</div>
</div>

<span class="material-symbols-outlined text-[20px]">
                    arrow_back
                </span>
                BACK TO DASHBOARD
            </button>
</div>

<script>
        // Simple JS for button interaction feedback beyond CSS
        document.querySelector('button').addEventListener('click', function(e) {
            const btn = e.currentTarget;
            btn.style.opacity = '0.7';
            setTimeout(() => {
                btn.style.opacity = '1';
                // Simulated navigation action
                console.log('Navigating to dashboard...');
            }, 150);
        });
    </script>
