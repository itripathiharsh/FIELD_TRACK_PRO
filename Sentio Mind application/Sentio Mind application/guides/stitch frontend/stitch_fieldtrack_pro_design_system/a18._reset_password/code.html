<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center p-space-4">
<!-- Mobile Container (Max Width for Desktop Viewing) -->
<main class="w-full max-w-[400px] bg-surface rounded-xl shadow-lg border border-border-subtle overflow-hidden flex flex-col h-full md:h-auto min-h-[750px]">
<!-- Header Content (Canvas) -->
<div class="flex-1 overflow-y-auto pb-space-12 pt-space-6 px-space-4">
<!-- Branding & Title -->
<div class="flex flex-col items-center mb-space-8 text-center">
<div class="w-16 h-16 bg-primary-tint rounded-full flex items-center justify-center mb-space-4">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="font-h1-mobile text-h1-mobile text-on-surface mb-space-2">Reset Password</h1>
<p class="font-body text-body text-on-surface-variant">
                    Enter the 6-digit code sent to your email and create a new password.
                </p>
</div>
<form class="space-y-space-6">
<!-- OTP Section -->
<div>
<label class="block font-body-emphasis text-body-emphasis text-on-surface mb-space-2">Verification Code</label>
<div class="flex justify-between gap-space-2">
<input class="w-12 h-12 text-center font-h3 text-h3 rounded-lg border border-primary text-primary focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-colors" maxlength="1" type="text" value="8"/>
<input class="w-12 h-12 text-center font-h3 text-h3 rounded-lg border border-primary text-primary focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-colors" maxlength="1" type="text" value="4"/>
<input class="w-12 h-12 text-center font-h3 text-h3 rounded-lg border border-primary text-primary focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-colors" maxlength="1" type="text" value="2"/>
<input class="w-12 h-12 text-center font-h3 text-h3 rounded-lg border border-primary text-primary focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-colors" maxlength="1" type="text" value="9"/>
<input class="w-12 h-12 text-center font-h3 text-h3 rounded-lg border border-primary text-primary focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-colors" maxlength="1" type="text" value="1"/>
<input class="w-12 h-12 text-center font-h3 text-h3 rounded-lg border border-primary text-primary focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-colors" maxlength="1" type="text" value="5"/>
</div>
<div class="mt-space-2 flex justify-end">
<button class="font-caption text-caption text-secondary hover:text-secondary-container transition-colors" type="button">Resend OTP in 0:45</button>
</div>
</div>
<!-- New Password -->
<div>
<label class="block font-body-emphasis text-body-emphasis text-on-surface mb-space-2" for="new_password">New Password</label>
<div class="relative">
<input class="w-full h-[48px] px-space-4 border border-outline rounded-lg font-body text-body text-on-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none pr-12 transition-all" id="new_password" type="password" value="Str0ngP@ssw0rd"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface p-1" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-body-emphasis text-body-emphasis text-on-surface mb-space-2" for="confirm_password">Confirm Password</label>
<div class="relative">
<input class="w-full h-[48px] px-space-4 border border-outline rounded-lg font-body text-body text-on-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none pr-12 transition-all" id="confirm_password" type="password" value="Str0ngP@ssw0rd"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface p-1" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Password Strength & Requirements -->
<div class="bg-surface-container-low p-space-4 rounded-xl border border-border-subtle">
<div class="flex justify-between items-center mb-space-2">
<span class="font-caption text-caption text-on-surface-variant">Password Strength</span>
<span class="font-caption text-caption font-semibold text-primary">Strong</span>
</div>
<!-- Strength Bar -->
<div class="flex gap-1 h-2 mb-space-4">
<div class="flex-1 bg-primary rounded-l-full"></div>
<div class="flex-1 bg-primary"></div>
<div class="flex-1 bg-primary"></div>
<div class="flex-1 bg-primary rounded-r-full"></div>
</div>

<li class="flex items-center gap-space-2 text-primary">
<span class="material-symbols-outlined text-[16px]">check_circle</span> Minimum 8 characters
                        </li>
<li class="flex items-center gap-space-2 text-primary">
<span class="material-symbols-outlined text-[16px]">check_circle</span> 1 Uppercase letter
                        </li>
<li class="flex items-center gap-space-2 text-primary">
<span class="material-symbols-outlined text-[16px]">check_circle</span> 1 Lowercase letter
                        </li>
<li class="flex items-center gap-space-2 text-primary">
<span class="material-symbols-outlined text-[16px]">check_circle</span> 1 Number
                        </li>
<li class="flex items-center gap-space-2 text-primary">
<span class="material-symbols-outlined text-[16px]">check_circle</span> 1 Special character
                        </li>
</ul>

</div>

<button class="w-full h-[48px] bg-transparent text-secondary hover:bg-secondary-tint font-body-emphasis text-body-emphasis rounded-lg transition-colors flex items-center justify-center" type="button">
                Back to Login
            </button>
</div>
</main>
<script>
        // Simple script to handle focus movement on OTP inputs for demonstration
        const otpInputs = document.querySelectorAll('input[maxlength="1"]');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });
    </script>
