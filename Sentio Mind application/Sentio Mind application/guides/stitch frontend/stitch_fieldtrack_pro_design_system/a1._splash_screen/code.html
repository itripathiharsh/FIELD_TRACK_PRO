<body class="bg-background h-screen w-screen overflow-hidden flex items-center justify-center m-0 p-0 antialiased selection:bg-primary-tint selection:text-primary">
<!-- Main Splash Container -->
<main class="flex flex-col items-center justify-center w-full max-w-[360px] h-[800px] sm:h-full px-space-6 relative z-10 animate-fade-in-up">
<!-- Logo Mark Container -->
<div class="mb-space-6 relative flex items-center justify-center w-24 h-24">
<!-- Background highlight for the logo to give it presence -->
<div class="absolute inset-0 bg-primary-tint rounded-full opacity-50 scale-125"></div>
<!-- Custom SVG combining Pin and Checkmark -->
<svg class="w-16 h-16 text-primary relative z-10 drop-shadow-sm" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<!-- Pin Body -->
<path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2Z" fill="currentColor"></path>
<!-- Inner Cutout / Checkmark Integration area -->
<circle class="text-surface" cx="12" cy="9" fill="white" r="4.5"></circle>
<!-- Checkmark -->
<path d="M9.5 9L11 10.5L14.5 7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</div>
<!-- Wordmark -->
<h1 class="font-h1-mobile text-h1-mobile text-on-background text-center tracking-tight mb-space-12">
            FieldTrack Pro
        </h1>
<!-- Loading Indicator Area -->
<div class="w-48 h-1 bg-surface-container-high rounded-full overflow-hidden mt-space-8 shadow-inner">
<div class="h-full bg-primary rounded-full w-full origin-left animate-loading-bar"></div>
</div>
<!-- Optional subtle text for loading state -->
<div class="mt-space-4 font-micro text-micro text-text-muted opacity-70">
            Initializing workspace...
        </div>
</main>
<!-- Subtle background noise/texture for premium feel (CSS only) -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] z-0" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
