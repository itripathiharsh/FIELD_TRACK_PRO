<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Roboto:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#fffbff",
                        "surface-container-low": "#f2f3f9",
                        "on-secondary-container": "#003d6d",
                        "outline": "#6d7a73",
                        "error": "#E24B4A",
                        "secondary-tint": "#EAF3FC",
                        "inverse-on-surface": "#eff0f6",
                        "on-secondary-fixed-variant": "#004880",
                        "on-error-container": "#93000a",
                        "outline-variant": "#bccac1",
                        "surface-dim": "#d8dadf",
                        "primary-container": "#008560",
                        "on-surface": "#191c20",
                        "primary-tint": "#EAF7F1",
                        "on-tertiary-fixed": "#281800",
                        "on-error": "#ffffff",
                        "warning-tint": "#FFF6E5",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#3d4943",
                        "on-background": "#191c20",
                        "on-primary-fixed-variant": "#00513a",
                        "on-tertiary-fixed-variant": "#614000",
                        "on-primary-container": "#f5fff7",
                        "secondary": "#0060a8",
                        "secondary-fixed-dim": "#a1c9ff",
                        "surface-variant": "#e1e2e8",
                        "border-subtle": "#EDEFF2",
                        "tertiary-fixed-dim": "#fcbb4f",
                        "background": "#F7F8F9",
                        "primary": "#00694c",
                        "on-primary": "#ffffff",
                        "tertiary": "#7d5400",
                        "surface-container-high": "#e6e8ed",
                        "secondary-container": "#5da9fe",
                        "surface": "#FFFFFF",
                        "primary-fixed-dim": "#68dbae",
                        "error-tint": "#FDECEC",
                        "text-muted": "#8A919C",
                        "surface-container-highest": "#e1e2e8",
                        "on-primary-fixed": "#002115",
                        "tertiary-container": "#9d6a00",
                        "inverse-primary": "#68dbae",
                        "secondary-fixed": "#d2e4ff",
                        "error-container": "#ffdad6",
                        "surface-bright": "#f8f9ff",
                        "inverse-surface": "#2e3135",
                        "on-secondary-fixed": "#001c38",
                        "surface-tint": "#006c4e",
                        "tertiary-fixed": "#ffddb0",
                        "surface-container": "#eceef3",
                        "primary-fixed": "#86f8c9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "space-4": "16px",
                        "space-3": "12px",
                        "space-6": "24px",
                        "space-8": "32px",
                        "space-12": "48px",
                        "space-1": "4px",
                        "space-2": "8px"
                    },
                    "fontFamily": {
                        "h3": ["Inter"],
                        "h1-mobile": ["Roboto"],
                        "caption": ["Inter"],
                        "micro": ["Inter"],
                        "h2": ["Inter"],
                        "display": ["Inter"],
                        "h1": ["Inter"],
                        "body": ["Inter"],
                        "h2-mobile": ["Roboto"],
                        "body-emphasis": ["Inter"]
                    },
                    "fontSize": {
                        "h3": ["20px", { "lineHeight": "1.35", "fontWeight": "600" }],
                        "h1-mobile": ["28px", { "lineHeight": "1.25", "fontWeight": "700" }],
                        "caption": ["14px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "micro": ["12px", { "lineHeight": "1.3", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "h2": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display": ["36px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "h1": ["30px", { "lineHeight": "1.25", "fontWeight": "700" }],
                        "body": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "h2-mobile": ["22px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-emphasis": ["16px", { "lineHeight": "1.5", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body text-body min-h-screen flex justify-center">
<div class="w-full max-w-[480px] bg-background min-h-screen relative flex flex-col shadow-2xl">
<!-- Top App Bar (Custom for Settings context, no shell nav intended per logic rules) -->
<header class="flex justify-between items-center w-full px-space-4 h-[64px] z-40 bg-surface border-b border-surface-container-highest">
<button class="flex items-center justify-center w-12 h-12 rounded-full hover:bg-secondary-tint active:scale-95 duration-100 text-on-surface-variant">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-h2-mobile text-h2-mobile font-bold text-primary">Settings</h1>
<div class="w-12 h-12"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 px-space-4 py-space-6 flex flex-col gap-space-4">
<section class="flex flex-col gap-space-2">
<h2 class="font-micro text-micro text-on-surface-variant uppercase tracking-widest px-space-2">Preferences</h2>
<div class="bg-surface rounded-xl border border-neutral-100 shadow-sm overflow-hidden flex flex-col">
<button class="flex items-center justify-between w-full p-space-4 hover:bg-surface-container-low transition-colors text-left group min-h-[48px]">
<div class="flex items-center gap-space-3">
<div class="w-10 h-10 rounded-full bg-secondary-tint flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">notifications</span>
</div>
<span class="font-body-emphasis text-body-emphasis text-on-surface group-hover:text-primary transition-colors">Notification Preferences</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
<div class="h-[1px] w-full bg-neutral-100"></div>
<button class="flex items-center justify-between w-full p-space-4 hover:bg-surface-container-low transition-colors text-left group min-h-[48px]">
<div class="flex items-center gap-space-3">
<div class="w-10 h-10 rounded-full bg-secondary-tint flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">palette</span>
</div>
<span class="font-body-emphasis text-body-emphasis text-on-surface group-hover:text-primary transition-colors">Appearance</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
</div>
</section>
<section class="flex flex-col gap-space-2 mt-space-4">
<h2 class="font-micro text-micro text-on-surface-variant uppercase tracking-widest px-space-2">About</h2>
<div class="bg-surface rounded-xl border border-neutral-100 shadow-sm overflow-hidden flex flex-col">
<div class="flex items-center justify-between w-full p-space-4 min-h-[48px]">
<div class="flex items-center gap-space-3">
<div class="w-10 h-10 rounded-full bg-primary-tint flex items-center justify-center text-primary">
<span class="material-symbols-outlined">info</span>
</div>
<span class="font-body-emphasis text-body-emphasis text-on-surface">App Version</span>
</div>
<span class="font-caption text-caption text-on-surface-variant bg-surface-container-low px-space-2 py-space-1 rounded-full">v1.2.0</span>
</div>
</div>
</section>
<div class="mt-auto pt-space-8 pb-space-6">
<button class="flex items-center justify-center gap-space-2 w-full p-space-4 bg-error-tint hover:bg-error-container text-error rounded-xl transition-colors active:scale-[0.98] duration-150 min-h-[48px]">
<span class="material-symbols-outlined">logout</span>
<span class="font-body-emphasis text-body-emphasis">Log Out</span>
</button>
</div>
</main>
</div>
</body></html>
