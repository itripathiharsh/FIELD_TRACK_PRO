<body class="bg-background h-full text-on-surface antialiased flex flex-col items-center justify-center p-space-4 md:p-space-8">
<!-- Container focusing on mobile constraints max width -->
<main class="w-full max-w-[400px] flex flex-col gap-space-8 bg-surface p-space-6 rounded-xl shadow-lg border border-border-subtle">
<!-- Header Section -->
<header class="flex flex-col items-center text-center gap-space-4 pt-space-4">
<!-- Brand Logo Area (Simplified for context) -->
<div class="flex items-center justify-center w-space-12 h-space-12 bg-primary-tint rounded-lg mb-space-2">
<span class="material-symbols-outlined text-primary" data-icon="track_changes" style="font-size: 32px;">track_changes</span>
</div>
<h1 class="font-h1-mobile text-h1-mobile text-primary">FieldTrack Pro</h1>
<div class="mt-space-2 space-y-space-2">
<h2 class="font-h2-mobile text-h2-mobile text-on-surface">Forgot Password</h2>
<p class="font-body text-body text-on-surface-variant max-w-sm mx-auto">
                    Enter your registered email address or mobile number. We'll send you a verification code to reset your password.
                </p>
</div>
</header>
<!-- Illustration -->
<div class="w-full h-40 bg-secondary-tint rounded-xl flex items-center justify-center overflow-hidden border border-border-subtle relative">
<img class="object-cover w-full h-full opacity-80" data-alt="A modern, abstract digital illustration representing cybersecurity and identity verification. The artwork features soft, glowing geometric shapes like stylized shields and keys, set against a pristine, light-mode background. The color palette incorporates professional teal and secondary blue tones, conveying a sense of systematic reliability, safety, and modern corporate software infrastructure." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDIoGdRQNewhMaUhc2aNXo_f_MUNmlV7Y5Gk0nLiUkVzecr5EpQNILdRpcPJ_tkt8bWonUHHYqh2RrBRJs9Zlh9jaHwE5q-AV9j0iF6SlOXDgue-_UHd3m1ChLO25dpZbAlVDrAtcZLogeq4XvGgdbkyLyhBn7gNXRPD3kuWSztTERIR1fy6hrQP85IOHMmhJs4HD7pXAi6P8WoKcBnldYItpPyMrgYL8gfoOPXzXE14h9dIsb_RbYp"/>
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-primary bg-surface p-3 rounded-full shadow-md" data-icon="lock_reset" style="font-size: 36px;">lock_reset</span>
</div>
</div>
<!-- Form Section -->
<form action="#" class="flex flex-col gap-space-6" method="POST" onsubmit="event.preventDefault();">
<!-- Input Group -->
<div class="flex flex-col gap-space-2">
<label class="font-body-emphasis text-body-emphasis text-on-surface" for="recovery-input">Email or Mobile Number</label>
<div class="relative flex focus-within:ring-2 focus-within:ring-secondary rounded-lg border border-outline-variant bg-surface transition-all overflow-hidden h-[56px]">
<!-- Country Code / Icon Prefix area -->
<div class="flex items-center justify-center pl-space-3 pr-space-2 bg-surface-container-low border-r border-outline-variant text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="mail">mail</span>
</div>
<input class="w-full h-full border-none bg-transparent px-space-3 font-body text-body text-on-surface placeholder:text-text-muted focus:ring-0" id="recovery-input" name="recovery" placeholder="worker@fieldtrack.pro" required="" type="text"/>
</div>
<p class="font-caption text-caption text-text-muted">Must be an active account identifier.</p>
</div>
<!-- Actions -->
<div class="flex flex-col gap-space-4 mt-space-2">
<button class="w-full h-[48px] bg-primary hover:bg-primary-container text-on-primary font-body-emphasis text-body-emphasis rounded-lg transition-colors flex items-center justify-center shadow-sm" type="submit">
                    Send Verification Code
                </button>
<button class="w-full h-[48px] bg-transparent hover:bg-primary-tint text-primary font-body-emphasis text-body-emphasis rounded-lg transition-colors flex items-center justify-center border border-transparent hover:border-primary-tint" type="button">
<span class="material-symbols-outlined mr-2" data-icon="arrow_back" style="font-size: 20px;">arrow_back</span>
                    Back to Login
                </button>
</div>
</form>

<span class="material-symbols-outlined" data-icon="help" style="font-size: 16px;">help</span>
                Need Help? Contact Administrator
