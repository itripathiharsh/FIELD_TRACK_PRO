<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        .progress-ring {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .progress-ring__circle {
            stroke-dasharray: 100, 100;
            stroke-dashoffset: 25; /* 75% complete */
            transition: stroke-dashoffset 0.35s;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col antialiased selection:bg-primary-tint selection:text-primary">
<!-- Top App Bar (Task-Focused: No global nav, back button present) -->
<header class="bg-surface border-b border-surface-container-highest flex items-center justify-between px-space-4 h-[64px] z-40 sticky top-0">
<button class="w-[48px] h-[48px] flex items-center justify-center text-on-surface hover:bg-surface-container-low rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="flex-1 flex flex-col items-center justify-center">
<h1 class="font-h2-mobile text-h2-mobile text-on-surface">Photos &amp; Documents</h1>
<div class="flex items-center gap-1 mt-1">
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-4 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
</div>
</div>
<div class="w-[48px]"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-space-4 pt-space-6 pb-[100px] gap-space-8 overflow-y-auto">
<!-- Action Tiles -->
<section class="grid grid-cols-2 gap-space-4">
<button class="bg-surface border-2 border-dashed border-outline-variant rounded-[12px] p-space-4 flex flex-col items-center justify-center gap-space-2 h-[120px] hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<div class="w-[48px] h-[48px] rounded-full bg-primary-tint flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
<span class="font-body-emphasis text-body-emphasis text-on-surface">Take Photo</span>
</button>
<button class="bg-surface border-2 border-dashed border-outline-variant rounded-[12px] p-space-4 flex flex-col items-center justify-center gap-space-2 h-[120px] hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<div class="w-[48px] h-[48px] rounded-full bg-secondary-tint flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">note_add</span>
</div>
<span class="font-body-emphasis text-body-emphasis text-on-surface">Add Document</span>
</button>
</section>
<!-- Attachments Gallery -->
<section class="flex flex-col gap-space-4">
<div class="flex items-center justify-between">
<h2 class="font-h3 text-h3 text-on-surface">Attached (4)</h2>
<button class="font-micro text-micro text-primary hover:underline h-[48px] px-space-2 flex items-center">Edit</button>
</div>
<div class="grid grid-cols-3 gap-space-2">
<!-- Thumbnail 1: Uploading -->
<div class="relative aspect-square rounded-[12px] overflow-hidden bg-surface-container-low shadow-sm border border-border-subtle group">
<img class="w-full h-full object-cover opacity-50" data-alt="A modern construction site showing partially completed steel framing under a bright, clear blue sky. The image is taken from a low angle, emphasizing the scale of the structure. The lighting is harsh midday sun, casting strong geometric shadows. The overall aesthetic is industrial, professional, and high-contrast, fitting a corporate field operations app context." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDZo826qjuFjlr2tqWSO5gMgsCI-7t4_Fw5avalZo90WC9EMV0XFOGEFp4pX-wesCCiM4qOg_HXprLJsb58gNESay22GOhjxfnFjNYjfUaA5y4Zgs4xI82_AAPiqiIqB3vJG2WYEYHmYwqNrH9MzcvIQ_L3R1aK3-QIszI0ZagRvF5oKPCrHZlyY9kV0OJwbf56E6qIInULtG0yYzH1daPeUzMa6bsiBXFPX17ftts5IaZGasFZwdaf"/>
<div class="absolute inset-0 flex items-center justify-center bg-on-background/20 backdrop-blur-[2px]">
<svg class="progress-ring w-[48px] h-[48px]" viewbox="0 0 36 36">
<circle class="text-surface-variant/50" cx="18" cy="18" fill="transparent" r="16" stroke="currentColor" stroke-width="3"></circle>
<circle class="progress-ring__circle text-primary" cx="18" cy="18" fill="transparent" r="16" stroke="currentColor" stroke-width="3"></circle>
</svg>
</div>
</div>
<!-- Thumbnail 2: Completed Image -->
<div class="relative aspect-square rounded-[12px] overflow-hidden bg-surface-container-low shadow-sm border border-border-subtle group">
<img class="w-full h-full object-cover" data-alt="A detailed close-up of a commercial HVAC unit installed on a flat gravel roof. The metallic surfaces reflect the soft, overcast daylight, creating a balanced, low-contrast exposure. Focus is sharp on the manufacturer's specification plate, while the background gently blurs. The mood is technical and objective, suitable for a field inspection report." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCQiGn74MOYQLJiClNvKGEWT-GljGasWDWE7ik3_7XZQzQFG4uvwcuUfbxHV88OKE9QbrF9HTvRg4Rf3m4l8vrrPGEYEXhFfY7nKlJrNHnEBu1cmwVkT0DJWOwK4e3cEYI__BZ4Kavy4xsxcT0InqbMR180pIIhtNlq2wwqJbl3qtnxgjtiHocMY1U4RnVNy_usYjgh9D73dFfm3NPg44m2p-oJ_W5apoIbfwcmjzGCQ3JQACZ3dfLo"/>
<button class="absolute top-1 right-1 w-6 h-6 bg-surface rounded-full flex items-center justify-center text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity shadow-sm">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Thumbnail 3: Document -->
<div class="relative aspect-square rounded-[12px] overflow-hidden bg-secondary-tint shadow-sm border border-secondary/20 flex flex-col items-center justify-center p-space-2 group">
<span class="material-symbols-outlined text-[32px] text-secondary mb-1" style="font-variation-settings: 'FILL' 1;">description</span>
<span class="font-micro text-micro text-secondary text-center truncate w-full">Site_Plan_v2.pdf</span>
<button class="absolute top-1 right-1 w-6 h-6 bg-surface rounded-full flex items-center justify-center text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity shadow-sm">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Thumbnail 4: Completed Image -->
<div class="relative aspect-square rounded-[12px] overflow-hidden bg-surface-container-low shadow-sm border border-border-subtle group">
<img class="w-full h-full object-cover" data-alt="A wide shot of a neatly organized utility closet with multiple electrical panels and neatly routed conduit pipes. The space is artificially lit by bright, cool-white LED overhead lights, ensuring every label and switch is clearly visible. The environment looks clean, professional, and up to code, conveying a sense of order and compliance." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDsME_NQbBHUcsHg0ddCoDQkRYSBQmPlw2aagVsC7PYzxo1-kjwR_Lu71q6L5IBsg2pqh_lZ3nQnVFHAdmQbJdr4U17SaM0s11dRzpdJcI1afQtZKSFvBvxjT_Rji7KZinaBXjvLIyQthagTaB8TWs8TPro4d1vtvgbIp3bUPRtcqJwCpEmYGktNY36t248WaEKV6S3b9f2ltDJNOOVJnRuLqj-wVy542zQsFU47XGTglz_ychWQ-mK"/>
<button class="absolute top-1 right-1 w-6 h-6 bg-surface rounded-full flex items-center justify-center text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity shadow-sm">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Action (Transactional/Task-focused, no BottomNavBar) -->
<div class="fixed bottom-0 left-0 w-full p-space-4 bg-surface/90 backdrop-blur-md border-t border-surface-container-highest z-50">
<button class="w-full h-[48px] bg-primary text-on-primary rounded-lg font-body-emphasis text-body-emphasis flex items-center justify-center hover:bg-primary/90 active:scale-[0.98] transition-all shadow-md">
            Next Step
        </button>
</div>
</body></html>
