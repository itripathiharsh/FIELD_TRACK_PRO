<style>
        /* Hide scrollbar for clean UI on mobile */
        ::-webkit-scrollbar {
            display: none;
        }
        html {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .signature-canvas {
            touch-action: none; /* Prevent scrolling while signing */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body text-body antialiased min-h-screen flex flex-col md:hidden">
<!-- Top App Bar (Transactional, no shell nav) -->
<header class="bg-surface border-b border-surface-container-highest flex justify-between items-center w-full px-space-4 h-[64px] z-40 sticky top-0 shrink-0">
<button aria-label="Go Back" class="w-[48px] h-[48px] flex items-center justify-start text-on-surface-variant hover:bg-secondary-tint rounded-full transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-h2-mobile text-h2-mobile font-bold text-on-surface">Your Signature</h1>
<span class="font-micro text-micro text-on-surface-variant">Step 3 of 3</span>
</div>
<div class="w-[48px]"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-space-4 py-space-6 overflow-y-auto">
<div class="mb-space-4">
<p class="font-body text-body text-on-surface-variant">Please provide your signature below to confirm the visit details and authorize completion.</p>
</div>
<!-- Signature Capture Area -->
<div class="relative w-full h-[320px] bg-surface rounded-xl border border-outline-variant shadow-sm flex flex-col justify-end mb-space-6 overflow-hidden">
<!-- Dashed Baseline -->
<div class="absolute bottom-[60px] left-space-4 right-space-4 border-b border-dashed border-outline-variant"></div>
<!-- Placeholder Text (Visually centered, slightly above baseline) -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<span class="font-h3 text-h3 text-surface-variant select-none">Sign here</span>
</div>
<!-- Actual Drawing Canvas (Interactive Layer) -->
<canvas class="signature-canvas absolute inset-0 w-full h-full cursor-crosshair" id="signaturePad"></canvas>
<!-- Clear Button (Positioned inside canvas area) -->
<div class="absolute top-space-2 right-space-2">
<button class="h-[36px] px-space-3 bg-surface/80 backdrop-blur-sm border border-outline-variant rounded-lg font-body-emphasis text-body-emphasis text-on-surface-variant hover:bg-surface-container transition-colors flex items-center gap-space-2 z-10 shadow-sm" id="clearBtn" type="button">
<span class="material-symbols-outlined text-[18px]">ink_eraser</span>
                    Clear
                </button>
</div>
</div>
<!-- Spacer to push actions to bottom -->
<div class="flex-1"></div>
<!-- Action Buttons -->
<div class="flex flex-col gap-space-3 mt-auto pb-safe">
<button class="w-full h-[48px] bg-primary text-on-primary rounded-lg font-body-emphasis text-body-emphasis shadow-sm hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-space-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Confirm Signature
            </button>
</div>
</main>
<script>
        // Simple Signature Canvas Logic
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('signaturePad');
            const clearBtn = document.getElementById('clearBtn');
            const ctx = canvas.getContext('2d');
            
            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;

            // Resize canvas to match its CSS dimensions
            function resizeCanvas() {
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                // Basic styling for the signature line
                ctx.strokeStyle = '#191c20'; // on-surface color
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas(); // Initial setup

            function getCoordinates(e) {
                const rect = canvas.getBoundingClientRect();
                if (e.touches && e.touches.length > 0) {
                    return {
                        x: e.touches[0].clientX - rect.left,
                        y: e.touches[0].clientY - rect.top
                    };
                }
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            function startDrawing(e) {
                isDrawing = true;
                const coords = getCoordinates(e);
                [lastX, lastY] = [coords.x, coords.y];
                // Hide placeholder on first draw
                const placeholder = canvas.previousElementSibling;
                if(placeholder) placeholder.style.opacity = '0';
            }

            function draw(e) {
                if (!isDrawing) return;
                e.preventDefault(); // Prevent scrolling while drawing
                const coords = getCoordinates(e);
                
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(coords.x, coords.y);
                ctx.stroke();
                
                [lastX, lastY] = [coords.x, coords.y];
            }

            function stopDrawing() {
                isDrawing = false;
                ctx.beginPath(); // start a new path to prevent connected lines if clicked again
            }

            // Mouse Events
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            // Touch Events
            canvas.addEventListener('touchstart', startDrawing, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);

            // Clear Button
            clearBtn.addEventListener('click', () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                // Show placeholder again
                const placeholder = canvas.previousElementSibling;
                if(placeholder) placeholder.style.opacity = '1';
            });
        });
    </script>
</body></html>
