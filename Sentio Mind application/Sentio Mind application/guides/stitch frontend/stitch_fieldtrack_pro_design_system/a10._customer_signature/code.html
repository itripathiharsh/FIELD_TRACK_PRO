<body class="bg-background text-on-background font-body font-body antialiased min-h-screen flex flex-col items-center">
<div class="w-full max-w-md bg-surface min-h-screen shadow-lg flex flex-col relative">
<!-- Header: Linear/Transactional intent, no global nav -->
<header class="flex justify-between items-center w-full px-space-4 h-[64px] border-b border-surface-container-highest bg-surface">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low text-on-surface-variant transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-h2-mobile text-h2-mobile font-bold text-primary">Customer Signature</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col p-space-4 gap-space-6">
<div class="text-center mt-space-2">
<p class="font-body text-body text-on-surface-variant">
                    Please hand the phone to the customer to sign.
                </p>
</div>
<!-- Signature Area -->
<div class="flex-1 flex flex-col">
<div class="relative flex-1 bg-surface-container-lowest border-2 border-dashed border-outline-variant rounded-xl overflow-hidden shadow-sm flex flex-col">
<div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20">
<span class="material-symbols-outlined text-6xl text-outline" style="font-variation-settings: 'FILL' 1;">draw</span>
</div>
<canvas class="w-full h-full cursor-crosshair z-10 bg-transparent" id="signatureCanvas"></canvas>
<!-- Line indicator -->
<div class="absolute bottom-12 left-8 right-8 border-b-2 border-surface-variant pointer-events-none z-0"></div>
<div class="absolute bottom-6 left-8 text-on-surface-variant font-caption text-caption pointer-events-none z-0">
                        Sign here
                    </div>
</div>
<div class="flex justify-end mt-space-2">
<button class="font-body-emphasis text-body-emphasis text-secondary hover:text-secondary-container transition-colors py-2 px-4 rounded-lg flex items-center gap-2" id="clearBtn">
<span class="material-symbols-outlined text-sm">refresh</span> Clear
                    </button>
</div>
</div>
<!-- Actions Area -->
<div class="flex flex-col gap-space-3 mt-auto mb-space-4">
<button class="w-full h-[48px] bg-primary text-on-primary font-body-emphasis text-body-emphasis rounded-lg shadow-sm hover:bg-primary-fixed-variant transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined">check_circle</span>
                    Confirm Signature
                </button>
<p class="font-micro text-micro text-text-muted text-center px-space-4">
                    This confirms the customer agrees the visit was completed.
                </p>
</div>
</main>
</div>
<script>
        document.addEventListener("DOMContentLoaded", () => {
            const canvas = document.getElementById('signatureCanvas');
            const clearBtn = document.getElementById('clearBtn');
            const ctx = canvas.getContext('2d');
            
            let isDrawing = false;

            // Resize canvas to fit container
            function resizeCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                // Preserve drawing context settings after resize
                ctx.strokeStyle = '#00694c'; // primary teal
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            }
            
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function getCoordinates(e) {
                const rect = canvas.getBoundingClientRect();
                if (e.touches && e.touches.length > 0) {
                    return {
                        x: e.touches[0].clientX - rect.left,
                        y: e.touches[0].clientY - rect.top
                    };
                }
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            function startDrawing(e) {
                isDrawing = true;
                const pos = getCoordinates(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                e.preventDefault();
            }

            function draw(e) {
                if (!isDrawing) return;
                const pos = getCoordinates(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                e.preventDefault();
            }

            function stopDrawing() {
                isDrawing = false;
            }

            // Mouse events
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            // Touch events
            canvas.addEventListener('touchstart', startDrawing, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);
            canvas.addEventListener('touchcancel', stopDrawing);

            // Clear button
            clearBtn.addEventListener('click', () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });
        });
    </script>
