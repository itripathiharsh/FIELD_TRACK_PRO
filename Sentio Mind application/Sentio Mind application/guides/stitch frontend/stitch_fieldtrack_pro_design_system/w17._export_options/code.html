<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Export Configuration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#5da9fe",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#614000",
                        "border-subtle": "#EDEFF2",
                        "tertiary-fixed-dim": "#fcbb4f",
                        "tertiary": "#7d5400",
                        "secondary-fixed-dim": "#a1c9ff",
                        "primary": "#00694c",
                        "surface": "#FFFFFF",
                        "outline-variant": "#bccac1",
                        "inverse-primary": "#68dbae",
                        "primary-fixed": "#86f8c9",
                        "surface-bright": "#f8f9ff",
                        "surface-tint": "#006c4e",
                        "secondary-tint": "#EAF3FC",
                        "on-background": "#191c20",
                        "on-primary-fixed": "#002115",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#3d4943",
                        "on-error-container": "#93000a",
                        "background": "#F7F8F9",
                        "outline": "#6d7a73",
                        "surface-dim": "#d8dadf",
                        "surface-container-low": "#f2f3f9",
                        "primary-container": "#008560",
                        "primary-tint": "#EAF7F1",
                        "on-tertiary-fixed": "#281800",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "error": "#E24B4A",
                        "surface-container-highest": "#e1e2e8",
                        "error-tint": "#FDECEC",
                        "surface-variant": "#e1e2e8",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffddb0",
                        "text-muted": "#8A919C",
                        "on-secondary-fixed": "#001c38",
                        "tertiary-container": "#9d6a00",
                        "on-secondary-container": "#003d6d",
                        "on-surface": "#191c20",
                        "surface-container": "#eceef3",
                        "on-tertiary-container": "#fffbff",
                        "warning-tint": "#FFF6E5",
                        "inverse-on-surface": "#eff0f6",
                        "secondary": "#0060a8",
                        "surface-container-high": "#e6e8ed",
                        "primary-fixed-dim": "#68dbae",
                        "on-primary-container": "#f5fff7",
                        "on-secondary-fixed-variant": "#004880",
                        "secondary-fixed": "#d2e4ff",
                        "inverse-surface": "#2e3135",
                        "on-primary-fixed-variant": "#00513a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "space-4": "16px",
                        "space-2": "8px",
                        "space-8": "32px",
                        "space-6": "24px",
                        "space-12": "48px",
                        "space-1": "4px",
                        "space-3": "12px"
                    },
                    "fontFamily": {
                        "caption": ["Inter"],
                        "h2": ["Inter"],
                        "display": ["Inter"],
                        "body": ["Inter"],
                        "h1-mobile": ["Roboto"],
                        "h1": ["Inter"],
                        "body-emphasis": ["Inter"],
                        "micro": ["Inter"],
                        "h2-mobile": ["Roboto"],
                        "h3": ["Inter"]
                    },
                    "fontSize": {
                        "caption": ["14px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "h2": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display": ["36px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "body": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "h1-mobile": ["28px", { "lineHeight": "1.25", "fontWeight": "700" }],
                        "h1": ["30px", { "lineHeight": "1.25", "fontWeight": "700" }],
                        "body-emphasis": ["16px", { "lineHeight": "1.5", "fontWeight": "600" }],
                        "micro": ["12px", { "lineHeight": "1.3", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "h2-mobile": ["22px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "h3": ["20px", { "lineHeight": "1.35", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
<style>
        .spinner {
            border: 3px solid rgba(0, 105, 76, 0.1);
            border-left-color: #00694c;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-background font-body text-body text-on-background h-full w-full flex items-center justify-center p-space-4">
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-on-background/40 backdrop-blur-sm z-40 transition-opacity flex items-center justify-center">
<!-- Modal Container -->
<div class="bg-surface rounded-xl shadow-lg w-full max-w-2xl overflow-hidden flex flex-col z-50 animate-in fade-in zoom-in duration-200">
<!-- Header -->
<div class="px-space-6 py-space-6 border-b border-border-subtle flex justify-between items-start">
<div>
<h2 class="font-h2 text-h2 text-on-surface mb-space-1">Detailed Export Options</h2>
<p class="font-caption text-caption text-on-surface-variant">Configure your data export. Large reports may take a moment to generate.</p>
</div>
<button class="text-on-surface-variant hover:bg-surface-container-low p-space-2 rounded-full transition-colors">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
</div>
<!-- Content Area -->
<div class="p-space-6 overflow-y-auto" id="export-form-content">
<div class="grid grid-cols-1 md:grid-cols-2 gap-space-6">
<!-- Report Type -->
<div class="col-span-1 md:col-span-2">
<label class="block font-body-emphasis text-body-emphasis text-on-surface mb-space-2">Select Report Type</label>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-space-4">
<label class="relative flex cursor-pointer rounded-lg border border-border-subtle bg-surface p-space-4 shadow-sm focus-within:ring-2 focus-within:ring-secondary focus-within:border-secondary hover:bg-surface-container-lowest transition-all">
<input checked="" class="sr-only" name="report_type" type="radio" value="visits"/>
<div class="flex flex-col gap-space-2">
<span class="material-symbols-outlined text-primary text-[28px]">location_on</span>
<span class="font-body-emphasis text-body-emphasis">Visit Logs</span>
<span class="font-caption text-caption text-on-surface-variant">Daily visit history</span>
</div>
<span aria-hidden="true" class="pointer-events-none absolute -inset-px rounded-lg border-2 border-transparent peer-checked:border-primary"></span>
</label>
<label class="relative flex cursor-pointer rounded-lg border border-border-subtle bg-surface p-space-4 shadow-sm focus-within:ring-2 focus-within:ring-secondary focus-within:border-secondary hover:bg-surface-container-lowest transition-all">
<input class="sr-only" name="report_type" type="radio" value="performance"/>
<div class="flex flex-col gap-space-2">
<span class="material-symbols-outlined text-primary text-[28px]">assessment</span>
<span class="font-body-emphasis text-body-emphasis">Performance</span>
<span class="font-caption text-caption text-on-surface-variant">Team metrics</span>
</div>
<span aria-hidden="true" class="pointer-events-none absolute -inset-px rounded-lg border-2 border-transparent peer-checked:border-primary"></span>
</label>
<label class="relative flex cursor-pointer rounded-lg border border-border-subtle bg-surface p-space-4 shadow-sm focus-within:ring-2 focus-within:ring-secondary focus-within:border-secondary hover:bg-surface-container-lowest transition-all">
<input class="sr-only" name="report_type" type="radio" value="financial"/>
<div class="flex flex-col gap-space-2">
<span class="material-symbols-outlined text-primary text-[28px]">payments</span>
<span class="font-body-emphasis text-body-emphasis">Financials</span>
<span class="font-caption text-caption text-on-surface-variant">Billing &amp; expenses</span>
</div>
<span aria-hidden="true" class="pointer-events-none absolute -inset-px rounded-lg border-2 border-transparent peer-checked:border-primary"></span>
</label>
</div>
</div>
<!-- Date Range -->
<div class="col-span-1">
<label class="block font-body-emphasis text-body-emphasis text-on-surface mb-space-2">Date Range</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-space-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">calendar_month</span>
<select class="w-full pl-10 pr-space-4 py-space-3 rounded-lg border border-outline-variant bg-surface text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors outline-none appearance-none">
<option>Last 7 Days</option>
<option>Last 30 Days</option>
<option>This Month</option>
<option>Last Month</option>
<option>Custom Range...</option>
</select>
<span class="material-symbols-outlined absolute right-space-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px] pointer-events-none">expand_more</span>
</div>
</div>
<!-- Territory Filter -->
<div class="col-span-1">
<label class="block font-body-emphasis text-body-emphasis text-on-surface mb-space-2">Filter by Territory</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-space-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">map</span>
<select class="w-full pl-10 pr-space-4 py-space-3 rounded-lg border border-outline-variant bg-surface text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors outline-none appearance-none">
<option>All Territories</option>
<option>North Region</option>
<option>South Region</option>
<option>East Region</option>
<option>West Region</option>
</select>
<span class="material-symbols-outlined absolute right-space-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px] pointer-events-none">expand_more</span>
</div>
</div>
<!-- File Format -->
<div class="col-span-1 md:col-span-2 mt-space-2">
<label class="block font-body-emphasis text-body-emphasis text-on-surface mb-space-2">File Format</label>
<div class="flex flex-wrap gap-space-4">
<label class="inline-flex items-center cursor-pointer">
<input checked="" class="form-radio h-5 w-5 text-primary border-outline-variant focus:ring-primary" name="format" type="radio" value="csv"/>
<span class="ml-space-2 font-body text-body text-on-surface">CSV</span>
</label>
<label class="inline-flex items-center cursor-pointer">
<input class="form-radio h-5 w-5 text-primary border-outline-variant focus:ring-primary" name="format" type="radio" value="excel"/>
<span class="ml-space-2 font-body text-body text-on-surface">Excel (.xlsx)</span>
</label>
<label class="inline-flex items-center cursor-pointer">
<input class="form-radio h-5 w-5 text-primary border-outline-variant focus:ring-primary" name="format" type="radio" value="pdf"/>
<span class="ml-space-2 font-body text-body text-on-surface">PDF</span>
</label>
</div>
</div>
</div>
</div>
<!-- Loading State (Hidden by default) -->
<div class="hidden flex-col items-center justify-center p-space-12 h-64" id="loading-state">
<div class="w-12 h-12 rounded-full spinner mb-space-4"></div>
<h3 class="font-h3 text-h3 text-on-surface mb-space-1">Generating Export...</h3>
<p class="font-caption text-caption text-on-surface-variant text-center max-w-sm">Gathering data and formatting your report. This may take a few moments depending on the size of the dataset.</p>
</div>
<!-- Footer Actions -->
<div class="px-space-6 py-space-4 border-t border-border-subtle bg-surface-container-low flex justify-end gap-space-3" id="modal-footer">
<button class="px-space-4 py-space-2 rounded-lg font-body-emphasis text-body-emphasis text-on-surface-variant hover:bg-surface-dim transition-colors h-12 min-w-[100px]">
                    Cancel
                </button>
<button class="px-space-6 py-space-2 rounded-lg font-body-emphasis text-body-emphasis bg-primary text-on-primary hover:bg-primary-container transition-colors shadow-sm h-12 flex items-center gap-space-2" id="btn-generate">
<span class="material-symbols-outlined text-[20px]">download</span>
                    Generate Export
                </button>
</div>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnGenerate = document.getElementById('btn-generate');
            const formContent = document.getElementById('export-form-content');
            const loadingState = document.getElementById('loading-state');
            const modalFooter = document.getElementById('modal-footer');
            
            // Interaction script to show loading state
            btnGenerate.addEventListener('click', () => {
                formContent.classList.add('hidden');
                modalFooter.classList.add('hidden');
                loadingState.classList.remove('hidden');
                loadingState.classList.add('flex');
                
                // Simulate loading completion after 3 seconds for demonstration
                setTimeout(() => {
                    // Reset to form
                    loadingState.classList.add('hidden');
                    loadingState.classList.remove('flex');
                    formContent.classList.remove('hidden');
                    modalFooter.classList.remove('hidden');
                    
                    // Optional: Show a success toast or trigger actual download
                    alert('Export generated successfully!');
                }, 3000);
            });
            
            // Radio button styling update logic
            const radioLabels = document.querySelectorAll('input[name="report_type"]');
            radioLabels.forEach(radio => {
                radio.addEventListener('change', function() {
                   document.querySelectorAll('label:has(input[name="report_type"])').forEach(label => {
                       label.classList.remove('border-primary', 'bg-primary-tint');
                       label.classList.add('border-border-subtle');
                   });
                   
                   if(this.checked) {
                       const parentLabel = this.closest('label');
                       parentLabel.classList.remove('border-border-subtle');
                       parentLabel.classList.add('border-primary', 'bg-primary-tint');
                   }
                });
            });
            
            // Initial setup for checked radio
            const initialChecked = document.querySelector('input[name="report_type"]:checked');
            if(initialChecked) {
                 const parentLabel = initialChecked.closest('label');
                 parentLabel.classList.remove('border-border-subtle');
                 parentLabel.classList.add('border-primary', 'bg-primary-tint');
            }
        });
    </script>
</body></html>
