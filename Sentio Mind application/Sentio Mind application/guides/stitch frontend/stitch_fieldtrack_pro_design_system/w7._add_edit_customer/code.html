<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .toggle-checkbox:checked {
            right: 0;
            border-color: #00694c; /* primary color */
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #00694c;
        }
        .toggle-checkbox {
            right: 0;
            z-index: 1;
            border-color: #bccac1;
            transition: all 0.2s ease;
        }
        .toggle-label {
            width: 48px;
            height: 24px;
            background-color: #bccac1;
            border-radius: 9999px;
            transition: all 0.2s ease;
        }
        .toggle-circle {
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.2s ease;
        }
        .toggle-checkbox:checked ~ .toggle-circle {
            transform: translateX(24px);
        }

<body class="bg-background text-on-background font-body text-body min-h-screen flex">
<!-- SideNavBar (from JSON) -->

<p class="font-caption text-caption text-on-surface-variant mt-1">Admin Dashboard</p>
</div>
<nav class="flex-1 space-y-2">
<a class="flex items-center gap-space-3 px-space-4 py-space-3 rounded-lg text-on-surface-variant dark:text-surface-variant hover:bg-surface-container transition-colors" href="#">

</a>
<a class="flex items-center gap-space-3 px-space-4 py-space-3 rounded-lg text-on-surface-variant dark:text-surface-variant hover:bg-surface-container transition-colors" href="#">
<span class="material-symbols-outlined">assessment</span>
<span class="font-body text-body">Reports</span>
</a>

<div class="mt-auto space-y-2">
<a class="flex items-center gap-space-3 px-space-4 py-space-3 rounded-lg text-on-surface-variant dark:text-surface-variant hover:bg-surface-container transition-colors" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-body text-body">Settings</span>
</a>

<span class="material-symbols-outlined">logout</span>
<span class="font-body text-body">Logout</span>
</a>

<!-- Main Content Area -->
<main class="ml-[240px] flex-1 flex flex-col h-screen overflow-hidden">
<!-- Page Header -->
<header class="h-[72px] bg-surface flex items-center px-space-6 border-b border-border-subtle shrink-0">
<button class="mr-space-4 p-space-2 rounded-full hover:bg-surface-container transition-colors text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="font-h2 text-h2 text-on-surface">Add Customer</h2>
</header>
<!-- Form Canvas -->
<div class="flex-1 overflow-y-auto p-space-6 flex items-start justify-center bg-background">
<div class="w-full max-w-[600px] bg-surface rounded-xl shadow-sm border border-border-subtle p-space-6 mt-space-6 mb-space-12">
<form class="space-y-space-6" onsubmit="event.preventDefault();">
<!-- Customer Name -->
<div class="flex flex-col gap-space-2">
<label class="font-body-emphasis text-body-emphasis text-on-surface" for="customerName">Customer Name</label>
<input class="h-[48px] px-space-3 rounded-lg border border-outline-variant bg-surface text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="customerName" placeholder="Enter full name or business name" type="text"/>
</div>
<!-- Contact Number -->
<div class="flex flex-col gap-space-2">
<label class="font-body-emphasis text-body-emphasis text-on-surface" for="contactNumber">Contact Number</label>
<input class="h-[48px] px-space-3 rounded-lg border border-outline-variant bg-surface text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="contactNumber" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<!-- Address -->
<div class="flex flex-col gap-space-2">
<label class="font-body-emphasis text-body-emphasis text-on-surface" for="address">Address</label>
<input class="h-[48px] px-space-3 rounded-lg border border-outline-variant bg-surface text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="address" placeholder="123 Main St, City, State, ZIP" type="text"/>
</div>
<!-- Map Toggle -->
<div class="py-space-2 border-t border-b border-border-subtle">
<div class="flex items-center justify-between">
<label class="font-body text-body text-on-surface cursor-pointer select-none" for="mapToggle">Set exact location on map instead</label>
<div class="relative inline-block w-12 h-6 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" id="mapToggle" name="toggle" onchange="toggleMap()" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-outline-variant cursor-pointer" for="mapToggle"></label>
<div class="toggle-circle absolute cursor-pointer pointer-events-none"></div>
</div>
</div>
</div>
<!-- Map Area (Hidden by default) -->
<div class="hidden flex-col gap-space-2 transition-all duration-300 opacity-0 h-0 overflow-hidden" id="mapContainer">
<p class="font-caption text-caption text-on-surface-variant mb-1">Drag the pin to set the precise customer location.</p>
<div class="relative w-full h-[250px] rounded-lg border border-outline-variant overflow-hidden bg-surface-container flex items-center justify-center">

<!-- Draggable Pin Indicator (Visual representation) -->
<div class="absolute z-10 flex flex-col items-center cursor-move transform -translate-y-1/2">
<div class="w-8 h-8 bg-secondary text-on-secondary rounded-full flex items-center justify-center shadow-lg transform hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="w-2 h-2 bg-secondary rounded-full mt-1 shadow-sm"></div>

<button class="w-10 h-10 bg-surface rounded-lg shadow-sm border border-border-subtle flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined">add</span>
</button>
<button class="w-10 h-10 bg-surface rounded-lg shadow-sm border border-border-subtle flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined">remove</span>
</button>
</div>
</div>
</div>
<!-- Check-in Radius -->
<div class="flex flex-col gap-space-2 pt-space-2">
<label class="font-body-emphasis text-body-emphasis text-on-surface" for="radius">Check-in Radius (meters)</label>
<input class="h-[48px] px-space-3 rounded-lg border border-outline-variant bg-surface text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all w-1/3 min-w-[150px]" id="radius" type="number" value="75"/>
<p class="font-caption text-caption text-text-muted">Default 75m</p>
</div>
<!-- Actions -->
<div class="flex items-center justify-end gap-space-4 pt-space-6 border-t border-border-subtle mt-space-8">
<button class="h-[48px] px-space-6 rounded-lg font-body-emphasis text-body-emphasis text-primary bg-transparent hover:bg-primary-tint transition-colors" type="button">
                            Cancel
                        </button>
<button class="h-[48px] px-space-6 rounded-lg font-body-emphasis text-body-emphasis text-on-primary bg-primary hover:bg-surface-tint shadow-sm transition-colors flex items-center gap-2" type="submit">
<span class="material-symbols-outlined text-[20px]">save</span>
                            Save Customer
                        </button>
</div>
</form>
</div>
</div>
</main>
<script>
        function toggleMap() {
            const toggle = document.getElementById('mapToggle');
            const mapContainer = document.getElementById('mapContainer');
            
            if (toggle.checked) {
                mapContainer.classList.remove('hidden');
                // Small delay to allow display:block to apply before animating opacity/height
                setTimeout(() => {
                    mapContainer.classList.remove('opacity-0', 'h-0');
                    mapContainer.classList.add('opacity-100', 'h-[300px]');
                }, 10);
            } else {
                mapContainer.classList.remove('opacity-100', 'h-[300px]');
                mapContainer.classList.add('opacity-0', 'h-0');
                
                // Wait for transition to finish before hiding
                setTimeout(() => {
                    mapContainer.classList.add('hidden');
                }, 300);
            }
        }
    </script>
