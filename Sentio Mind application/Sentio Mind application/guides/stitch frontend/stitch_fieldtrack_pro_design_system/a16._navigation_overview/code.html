<style>
        .map-container {
            position: relative;
            height: 45vh; /* Responsive height */
            background-color: #e5e5e5; /* Fallback */
            overflow: hidden;
        }
        
        .route-line {
            position: absolute;
            top: 50%;
            left: 20%;
            width: 60%;
            height: 4px;
            background: linear-gradient(to right, transparent, #0060a8, transparent);
            transform: rotate(-15deg);
            z-index: 10;
        }

        .map-pin {
            position: absolute;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .employee-dot {
            bottom: 30%;
            left: 20%;
            background-color: #ffffff;
            border: 2px solid #0060a8;
        }
        
        .employee-inner-dot {
             width: 12px;
             height: 12px;
             background-color: #0060a8;
             border-radius: 50%;
        }

        .customer-pin {
            top: 40%;
            right: 20%;
            background-color: #00694c;
            color: white;
        }
        
        .map-overlay-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -150%);
            z-index: 30;
        }
        
        .content-card-scroll {
             height: calc(100vh - 45vh - 64px); /* Full height minus map and header */
             overflow-y: auto;
             background-color: #F7F8F9;
        }
        
        .bottom-actions-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(247, 248, 249, 1) 70%, rgba(247, 248, 249, 0));
            padding-bottom: env(safe-area-inset-bottom, 16px);
            z-index: 40;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-emphasis h-screen w-screen overflow-hidden flex flex-col md:hidden">
<!-- Top App Bar (Contextual/Transactional - No Global Nav) -->
<header class="bg-surface border-b border-surface-container-highest flex justify-between items-center w-full px-space-4 h-[64px] z-40 shrink-0">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center -ml-2 rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="flex-1 px-space-2 truncate">
<h1 class="font-h2-mobile text-h2-mobile text-on-surface truncate">Apex Manufacturing</h1>
</div>
<!-- Status Badge -->
<div class="bg-secondary-tint px-space-3 py-space-1 rounded-full flex items-center justify-center shrink-0">
<span class="font-micro text-micro text-secondary">In Progress</span>
</div>
</header>
<!-- Interactive Map Area -->
<div class="map-container relative w-full shrink-0">
<!-- Background Map Image Placeholder -->

<div class="employee-inner-dot"></div>
</div>
<!-- Customer Location (Destination) -->
<div class="map-pin customer-pin">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<!-- Overlay Stats Badge -->
<div class="map-overlay-badge bg-surface px-space-3 py-space-2 rounded-lg shadow-sm border border-border-subtle flex items-center gap-space-2">
<div class="flex flex-col">

</div>
<div class="w-px h-8 bg-border-subtle"></div>

</div>
</div>

<div class="flex items-start justify-between mb-space-4">
<div>
<h2 class="font-h3 text-h3 text-on-surface mb-1">Apex Manufacturing</h2>
<div class="flex items-start gap-space-2 text-text-muted mt-space-2">
<span class="material-symbols-outlined text-[20px] mt-0.5">location_on</span>
<p class="font-body text-body">1400 Industrial Pkwy<br/>Sector 4, Building B</p>
</div>
</div>
</div>
<div class="h-px w-full bg-border-subtle my-space-4"></div>
<div class="grid grid-cols-1 gap-space-4">
<div class="flex items-center gap-space-3">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
<div>
<p class="font-caption text-caption text-text-muted mb-0.5">Contact</p>
<p class="font-body-emphasis text-body-emphasis text-on-surface">(555) 012-3456</p>
</div>
</div>
<div class="flex items-center gap-space-3">
<div class="w-10 h-10 rounded-full bg-primary-tint flex items-center justify-center shrink-0">

</div>
<div>

        </button>
