<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Notifications</title>

        tailwind.config = {

                    "colors": {

                        "outline": "#6d7a73",

                        "secondary-tint": "#EAF3FC",
                        "inverse-on-surface": "#eff0f6",
                        "on-secondary-fixed-variant": "#004880",
                        "on-error-container": "#93000a",
                        "outline-variant": "#bccac1",
                        "surface-dim": "#d8dadf",
                        "primary-container": "#008560",
                        "on-surface": "#191c20",
                        "primary-tint": "#EAF7F1",
                        "on-tertiary-fixed": "#281800",
                        "on-error": "#ffffff",
                        "warning-tint": "#FFF6E5",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#3d4943",
                        "on-background": "#191c20",
                        "on-primary-fixed-variant": "#00513a",
                        "on-tertiary-fixed-variant": "#614000",
                        "on-primary-container": "#f5fff7",
                        "secondary": "#0060a8",
                        "secondary-fixed-dim": "#a1c9ff",
                        "surface-variant": "#e1e2e8",
                        "border-subtle": "#EDEFF2",
                        "tertiary-fixed-dim": "#fcbb4f",
                        "background": "#F7F8F9",
                        "primary": "#00694c",
                        "on-primary": "#ffffff",
                        "tertiary": "#7d5400",
                        "surface-container-high": "#e6e8ed",
                        "secondary-container": "#5da9fe",
                        "surface": "#FFFFFF",
                        "primary-fixed-dim": "#68dbae",
                        "error-tint": "#FDECEC",
                        "text-muted": "#8A919C",
                        "surface-container-highest": "#e1e2e8",
                        "on-primary-fixed": "#002115",
                        "tertiary-container": "#9d6a00",
                        "inverse-primary": "#68dbae",
                        "secondary-fixed": "#d2e4ff",
                        "error-container": "#ffdad6",

                        "surface-tint": "#006c4e",

                        "primary-fixed": "#86f8c9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "space-4": "16px",
                        "space-3": "12px",
                        "space-6": "24px",
                        "space-8": "32px",
                        "space-12": "48px",
                        "space-1": "4px",
                        "space-2": "8px",
                        "safe": "env(safe-area-inset-bottom, 20px)"
                    },
                    "fontFamily": {
                        "h3": ["Inter"],
                        "h1-mobile": ["Roboto"],
                        "caption": ["Inter"],

                        "body-emphasis": ["16px", { "lineHeight": "1.5", "fontWeight": "600" }]

                }

        }

<style>
        body { -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col md:hidden">
<!-- TopAppBar -->
<header class="bg-surface border-b border-surface-container-highest docked full-width top-0 sticky z-40">
<div class="flex justify-between items-center w-full px-space-4 h-[64px]">
<div class="flex items-center gap-space-3">
<button class="text-on-surface p-space-2 rounded-full hover:bg-surface-container-high transition-colors -ml-space-2">
<span class="material-symbols-outlined text-h2-mobile">arrow_back</span>
</button>
<h1 class="font-h1-mobile text-h1-mobile text-on-surface">Notifications</h1>
</div>
<div class="flex items-center">
<button class="text-primary font-body-emphasis text-body-emphasis px-space-2 py-space-1 rounded hover:bg-primary-tint transition-colors">
                    Mark all read
                </button>
</div>
</div>
</header>
<!-- Main Content: Notifications List -->
<main class="flex-1 w-full flex flex-col pb-safe">
<!-- List Container -->
<div class="flex flex-col bg-surface mt-space-2 divide-y divide-border-subtle border-y border-border-subtle">
<!-- Unread Item 1: Schedule Change -->
<button class="flex items-start w-full text-left p-space-4 bg-primary-tint hover:bg-surface-container-low transition-colors relative group">
<div class="absolute top-space-4 right-space-4 w-space-2 h-space-2 rounded-full bg-primary"></div>
<div class="flex-shrink-0 w-space-12 h-space-12 rounded-full bg-secondary-tint flex items-center justify-center mr-space-4">
<span class="material-symbols-outlined text-secondary text-h2-mobile">calendar_month</span>
</div>
<div class="flex-1 min-w-0 pr-space-6">
<div class="flex justify-between items-baseline mb-space-1">
<h3 class="font-body-emphasis text-body-emphasis text-on-surface truncate pr-space-2">Schedule Updated</h3>
<span class="font-micro text-micro text-primary flex-shrink-0">Just now</span>
</div>
<p class="font-caption text-caption text-on-surface-variant line-clamp-2">
                        Your shift tomorrow at 104 Main St has been moved to 9:00 AM. Please confirm receipt.
                    </p>
</div>
</button>
<!-- Unread Item 2: Alert -->
<button class="flex items-start w-full text-left p-space-4 bg-primary-tint hover:bg-surface-container-low transition-colors relative group">
<div class="absolute top-space-4 right-space-4 w-space-2 h-space-2 rounded-full bg-primary"></div>
<div class="flex-shrink-0 w-space-12 h-space-12 rounded-full bg-warning-tint flex items-center justify-center mr-space-4">
<span class="material-symbols-outlined filled text-tertiary-container text-h2-mobile">warning</span>
</div>
<div class="flex-1 min-w-0 pr-space-6">
<div class="flex justify-between items-baseline mb-space-1">
<h3 class="font-body-emphasis text-body-emphasis text-on-surface truncate pr-space-2">Equipment Flag</h3>
<span class="font-micro text-micro text-primary flex-shrink-0">2m ago</span>
</div>
<p class="font-caption text-caption text-on-surface-variant line-clamp-2">
                        Unit #4B reported an irregular pressure reading during the last inspection check.
                    </p>
</div>
</button>
<!-- Read Item 1: Success -->
<button class="flex items-start w-full text-left p-space-4 bg-surface hover:bg-surface-container-low transition-colors group">
<div class="flex-shrink-0 w-space-12 h-space-12 rounded-full bg-primary-tint flex items-center justify-center mr-space-4">
<span class="material-symbols-outlined text-primary text-h2-mobile">check_circle</span>
</div>
<div class="flex-1 min-w-0 pr-space-6">
<div class="flex justify-between items-baseline mb-space-1">
<h3 class="font-body-emphasis text-body-emphasis text-on-surface truncate pr-space-2">Report Submitted</h3>
<span class="font-micro text-micro text-text-muted flex-shrink-0">1h ago</span>
</div>
<p class="font-caption text-caption text-on-surface-variant line-clamp-2">
                        Daily completion report for Region West successfully synced to the main server.
                    </p>
</div>
</button>
<!-- Read Item 2: Reminder -->
<button class="flex items-start w-full text-left p-space-4 bg-surface hover:bg-surface-container-low transition-colors group">
<div class="flex-shrink-0 w-space-12 h-space-12 rounded-full bg-surface-container-high flex items-center justify-center mr-space-4">
<span class="material-symbols-outlined text-on-surface-variant text-h2-mobile">schedule</span>
</div>
<div class="flex-1 min-w-0 pr-space-6">
<div class="flex justify-between items-baseline mb-space-1">
<h3 class="font-body text-body text-on-surface truncate pr-space-2">Timesheet Reminder</h3>
<span class="font-micro text-micro text-text-muted flex-shrink-0">Yesterday</span>
</div>
<p class="font-caption text-caption text-text-muted line-clamp-2">
                        Don't forget to submit your weekly timesheet by 5:00 PM today.
                    </p>
</div>
</button>
<!-- Read Item 3: General Info -->
<button class="flex items-start w-full text-left p-space-4 bg-surface hover:bg-surface-container-low transition-colors group">
<div class="flex-shrink-0 w-space-12 h-space-12 rounded-full bg-surface-container-high flex items-center justify-center mr-space-4">
<span class="material-symbols-outlined text-on-surface-variant text-h2-mobile">info</span>
</div>
<div class="flex-1 min-w-0 pr-space-6">
<div class="flex justify-between items-baseline mb-space-1">
<h3 class="font-body text-body text-on-surface truncate pr-space-2">System Update</h3>
<span class="font-micro text-micro text-text-muted flex-shrink-0">Oct 12</span>
</div>
<p class="font-caption text-caption text-text-muted line-clamp-2">
                        FieldTrack Pro will be undergoing scheduled maintenance this Sunday from 2 AM to 4 AM EST.
                    </p>
</div>
</button>
</div>
<!-- Empty State (Hidden by default, shown here for demonstration if list was empty) -->

        <div class="flex flex-col items-center justify-center flex-1 p-space-8 text-center h-[530px]">
            <div class="w-24 h-24 bg-surface-container rounded-full flex items-center justify-center mb-space-6">
                <span class="material-symbols-outlined text-[48px] text-outline-variant">notifications_off</span>
            </div>
            <h2 class="font-h2-mobile text-h2-mobile text-on-surface mb-space-2">No notifications yet</h2>
            <p class="font-body text-body text-on-surface-variant max-w-[280px]">
                When you get updates about your schedule, reports, or alerts, they'll show up here.
            </p>
        </div>
        -->
</main>
</body></html>
